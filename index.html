<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#0f1115">

<title>Coin Flip</title>

<style>
:root{
  color-scheme:dark;

  --bg:#0f1115;
  --panel:#171a20;
  --panel2:#1d2129;

  --text:#f5f7fb;
  --muted:#9ba3b0;
  --line:#2b313d;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;

  overflow:hidden;

  background:#0f1115;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);
}

body{
  overscroll-behavior:none;
  touch-action:manipulation;
}

.app{
  height:100dvh;

  display:grid;

  grid-template-rows:
    auto
    1fr
    auto;

  gap:12px;

  padding:
    calc(env(safe-area-inset-top) + 16px)
    18px
    calc(env(safe-area-inset-bottom) + 18px);

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(255,255,255,.055),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #101319,
      #0c0e12
    );
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.title{
  font-size:19px;
  font-weight:800;
  letter-spacing:.2px;
}

.mode{
  display:flex;

  gap:4px;

  padding:4px;

  border:
    1px solid
    var(--line);

  border-radius:14px;

  background:var(--panel);
}

.mode button{
  border:0;

  padding:
    9px
    12px;

  border-radius:10px;

  background:transparent;

  color:var(--muted);

  font-weight:750;
}

.mode button.active{
  color:var(--text);

  background:var(--panel2);

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.22);
}

.stage{
  position:relative;

  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  perspective:1200px;

  touch-action:none;
  user-select:none;
}

.hint{
  position:absolute;

  top:4%;
  left:50%;

  transform:
    translateX(-50%);

  width:
    min(
      92%,
      460px
    );

  text-align:center;

  color:var(--muted);

  font-size:14px;
  line-height:1.4;

  pointer-events:none;

  transition:
    opacity
    .2s;
}

.score{
  position:absolute;

  top:13%;
  left:50%;

  transform:
    translateX(-50%);

  opacity:0;

  color:var(--muted);

  font-size:14px;
  font-weight:750;

  pointer-events:none;

  transition:
    opacity
    .2s;
}

.score.show{
  opacity:1;
}

.coin-wrap{
  position:relative;

  width:210px;
  height:210px;

  transform-style:
    preserve-3d;

  will-change:
    transform;

  cursor:grab;
}

.coin-wrap.dragging{
  cursor:grabbing;
}

.coin{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  transform-style:
    preserve-3d;

  will-change:
    transform;
}

.face,
.edge{
  position:absolute;

  inset:0;

  border-radius:50%;

  backface-visibility:hidden;
}

.face{
  overflow:hidden;

  border:
    3px solid
    #adb2ba;

  background:#c8ccd2;

  box-shadow:
    inset
    0 0 0 1px
    rgba(255,255,255,.5),

    inset
    0 0 14px
    rgba(0,0,0,.18),

    0 18px 34px
    rgba(0,0,0,.42);
}

.heads{
  transform:
    translateZ(8px);
}

.tails{
  transform:
    rotateY(180deg)
    translateZ(8px);
}

.quarter-photo{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;

  transform:
    scale(1.015);

  filter:
    contrast(1.05)
    brightness(.98);

  pointer-events:none;
  user-select:none;
}

.edge{
  transform:
    translateZ(0);

  border:
    8px solid
    #8e949d;

  background:
    repeating-linear-gradient(
      90deg,

      #666c74 0 1px,

      #d8dbe0 1px 2px,

      #838992 2px 3px,

      #c3c7cd 3px 4px
    );

  box-shadow:
    inset
    0 0 8px
    rgba(0,0,0,.32);
}

.shadow{
  position:absolute;

  left:50%;
  top:
    calc(
      50% +
      135px
    );

  width:150px;
  height:34px;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.52),
      rgba(0,0,0,0) 70%
    );

  filter:
    blur(6px);

  opacity:.72;

  pointer-events:none;

  will-change:
    transform,
    opacity;
}

.result{
  position:absolute;

  left:50%;
  bottom:7%;

  transform:
    translateX(-50%)
    translateY(8px);

  opacity:0;

  text-align:center;

  font-size:28px;
  font-weight:850;
  letter-spacing:.5px;

  pointer-events:none;

  transition:
    opacity .22s,
    transform .22s;
}

.result.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

.result small{
  display:block;

  margin-top:5px;

  color:var(--muted);

  font-size:13px;
  font-weight:700;
}

.controls{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:9px;
}

.pill{
  min-width:0;

  padding:
    13px
    15px;

  border:
    1px solid
    var(--line);

  border-radius:16px;

  background:var(--panel);

  color:var(--text);

  font-size:14px;
  font-weight:800;
}

.pill.secondary{
  color:var(--muted);
}

.pill:active{
  transform:
    scale(.97);
}

.status{
  min-height:17px;

  margin-top:6px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

@media(max-height:650px){

  .coin-wrap{
    width:165px;
    height:165px;
  }

  .shadow{
    top:
      calc(
        50% +
        107px
      );
  }

  .result{
    bottom:2%;
  }

  .hint{
    top:1%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="title">
      Coin Flip
    </div>

    <div class="mode">

      <button
        id="singleBtn"
        class="active"
      >
        Single
      </button>

      <button
        id="bo3Btn"
      >
        Best of 3
      </button>

    </div>

  </header>

  <main
    class="stage"
    id="stage"
  >

    <div
      class="hint"
      id="hint"
    >
      Flick it any direction, tap it, or shake your phone
    </div>

    <div
      class="score"
      id="score"
    >
      Heads 0 · Tails 0
    </div>

    <div
      class="shadow"
      id="shadow"
    ></div>

    <div
      class="coin-wrap"
      id="coinWrap"
    >

      <div
        class="coin"
        id="coin"
      >

        <div
          class="face heads"
        >

          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg"
            alt="Heads"
            draggable="false"
          >

        </div>

        <div
          class="face tails"
        >

          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/e/eb/United_States_Quarter_Reverse_2021.jpg"
            alt="Tails"
            draggable="false"
          >

        </div>

        <div class="edge"></div>

      </div>

    </div>

    <div
      class="result"
      id="result"
    ></div>

  </main>

  <footer>

    <div class="controls">

      <button
        class="pill secondary"
        id="motionBtn"
      >
        Enable Shake
      </button>

      <button
        class="pill"
        id="flipBtn"
      >
        Flip
      </button>

      <button
        class="pill secondary"
        id="soundBtn"
      >
        Sound On
      </button>

    </div>

    <div
      class="status"
      id="status"
    >
      Secure 50/50 randomness
    </div>

  </footer>

</div>

<script>
(() => {

const stage =
  document.getElementById(
    'stage'
  );

const coinWrap =
  document.getElementById(
    'coinWrap'
  );

const coin =
  document.getElementById(
    'coin'
  );

const shadow =
  document.getElementById(
    'shadow'
  );

const resultEl =
  document.getElementById(
    'result'
  );

const scoreEl =
  document.getElementById(
    'score'
  );

const hint =
  document.getElementById(
    'hint'
  );

const singleBtn =
  document.getElementById(
    'singleBtn'
  );

const bo3Btn =
  document.getElementById(
    'bo3Btn'
  );

const motionBtn =
  document.getElementById(
    'motionBtn'
  );

const flipBtn =
  document.getElementById(
    'flipBtn'
  );

const soundBtn =
  document.getElementById(
    'soundBtn'
  );

const statusEl =
  document.getElementById(
    'status'
  );


let mode =
  'single';

let flipping =
  false;

let soundOn =
  true;

let audioCtx =
  null;

let currentFace =
  'heads';


/*
  Coin stays where it lands.
*/

let coinPos = {
  x:0,
  y:0
};


let series = {
  heads:0,
  tails:0
};


/*
  MOTION SENSOR STATE
*/

let motionEnabled =
  false;

let motionSamples =
  0;

let lastShake =
  0;

let lastMagnitude =
  9.81;

let motionTimer =
  null;


/*
  CRYPTO RANDOMNESS
*/

function secureBit(){
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);

  return (a[0] & 1) === 0
    ? 'heads'
    : 'tails';
}


function secureFloat(
  min,
  max
){

  const a =
    new Uint32Array(1);

  crypto.getRandomValues(a);

  return (
    min +
    (
      a[0] /
      4294967295
    ) *
    (
      max -
      min
    )
  );

}


function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/*
  AUDIO
*/

function ensureAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioCtx.state ===
    'suspended'
  ){

    audioCtx.resume();

  }

}


function tone(
  frequency,
  duration,
  gain=.04,
  delay=0,
  type='sine'
){

  if(!soundOn){
    return;
  }

  ensureAudio();

  const start =
    audioCtx.currentTime +
    delay;

  const oscillator =
    audioCtx.createOscillator();

  const volume =
    audioCtx.createGain();

  const filter =
    audioCtx.createBiquadFilter();

  oscillator.type =
    type;

  oscillator.frequency
    .setValueAtTime(
      frequency,
      start
    );

  oscillator.frequency
    .exponentialRampToValueAtTime(
      Math.max(
        80,
        frequency*.80
      ),
      start + duration
    );

  filter.type =
    'bandpass';

  filter.frequency.value =
    frequency;

  filter.Q.value =
    4.2;

  volume.gain
    .setValueAtTime(
      gain,
      start
    );

  volume.gain
    .exponentialRampToValueAtTime(
      .0001,
      start + duration
    );

  oscillator
    .connect(filter)
    .connect(volume)
    .connect(
      audioCtx.destination
    );

  oscillator.start(
    start
  );

  oscillator.stop(
    start +
    duration +
    .03
  );

}


function noiseTick(
  duration=.03,
  gain=.025,
  delay=0
){

  if(!soundOn){
    return;
  }

  ensureAudio();

  const sampleRate =
    audioCtx.sampleRate;

  const buffer =
    audioCtx.createBuffer(
      1,
      Math.floor(
        sampleRate *
        duration
      ),
      sampleRate
    );

  const data =
    buffer.getChannelData(0);

  for(
    let i=0;
    i<data.length;
    i++
  ){

    data[i] =
      secureFloat(
        -1,
        1
      ) *
      Math.pow(
        1 -
        i/data.length,
        2.4
      );

  }

  const source =
    audioCtx
      .createBufferSource();

  const highpass =
    audioCtx
      .createBiquadFilter();

  const volume =
    audioCtx
      .createGain();

  source.buffer =
    buffer;

  highpass.type =
    'highpass';

  highpass.frequency.value =
    1700;

  volume.gain.value =
    gain;

  source
    .connect(highpass)
    .connect(volume)
    .connect(
      audioCtx.destination
    );

  source.start(
    audioCtx.currentTime +
    delay
  );

}


function launchSound(){

  noiseTick(
    .018,
    .012
  );

  tone(
    170,
    .07,
    .013,
    0,
    'triangle'
  );

}


function clink(
  intensity=1
){

  const pitch =
    secureFloat(
      .93,
      1.08
    );

  noiseTick(
    .028,
    .027 *
    intensity
  );

  tone(
    520*pitch,
    .11,
    .040*intensity
  );

  tone(
    970*pitch,
    .078,
    .026*intensity,
    .006
  );

  tone(
    1480*pitch,
    .055,
    .016*intensity,
    .012
  );

  tone(
    275*pitch,
    .13,
    .015*intensity,
    .018,
    'triangle'
  );

}


function vibrate(
  pattern
){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      pattern
    );

  }

}


/*
  UI
*/

function clearResult(){

  resultEl
    .classList
    .remove(
      'show'
    );

}


function showResult(
  text,
  sub=''
){

  resultEl.innerHTML =
    `${text.toUpperCase()}${
      sub
        ? `<small>${sub}</small>`
        : ''
    }`;

  resultEl
    .classList
    .add(
      'show'
    );

}


function updateScore(){

  scoreEl.textContent =
    `Heads ${series.heads} · Tails ${series.tails}`;

}


function setMode(
  newMode
){

  if(flipping){
    return;
  }

  mode =
    newMode;

  singleBtn
    .classList
    .toggle(
      'active',
      mode ===
      'single'
    );

  bo3Btn
    .classList
    .toggle(
      'active',
      mode ===
      'bo3'
    );

  scoreEl
    .classList
    .toggle(
      'show',
      mode ===
      'bo3'
    );

  series = {
    heads:0,
    tails:0
  };

  updateScore();

  clearResult();

}


/*
  POSITION HELPERS
*/

function stageLimits(){

  const stageRect =
    stage.getBoundingClientRect();

  const coinRect =
    coinWrap.getBoundingClientRect();

  const radius =
    Math.min(
      coinRect.width,
      coinRect.height
    ) / 2;

  return {

    x:
      Math.max(
        20,
        stageRect.width/2 -
        radius -
        18
      ),

    y:
      Math.max(
        20,
        stageRect.height/2 -
        radius -
        42
      )

  };

}


function setRestingPosition(){

  coinWrap.style.transform =
    `translate3d(
      ${coinPos.x}px,
      ${coinPos.y}px,
      0
    )`;

  coin.style.transform =
    `rotateY(${
      currentFace ===
      'tails'
        ? 180
        : 0
    }deg)`;

  shadow.style.transform =
    `translate(
      calc(
        -50% +
        ${coinPos.x}px
      ),
      ${coinPos.y}px
    )`;

  shadow.style.opacity =
    '.72';

}


function cancelAnimations(){

  [
    coinWrap,
    coin,
    shadow
  ].forEach(
    element => {

      element
        .getAnimations()
        .forEach(
          animation =>
            animation.cancel()
        );

    }
  );

}


/*
  FLIP PHYSICS
*/

async function doFlip(
  gesture={}
){

  if(flipping){
    return;
  }

  flipping =
    true;

  clearResult();

  hint.style.opacity =
    '.15';

  cancelAnimations();

  setRestingPosition();


  /*
    OUTCOME HAPPENS FIRST.

    Gesture physics cannot
    affect heads or tails.
  */

  const outcome =
    secureBit();


  let vx =
    Number(
      gesture.vx || 0
    );

  let vy =
    Number(
      gesture.vy || 0
    );


  /*
    If triggered by button
    or shake, create a natural
    random direction.
  */

  if(
    Math.abs(vx) < .01 &&
    Math.abs(vy) < .01
  ){

    const angle =
      secureFloat(
        0,
        Math.PI*2
      );

    vx =
      Math.cos(angle);

    vy =
      Math.sin(angle);

  }


  const velocity =
    Math.hypot(
      vx,
      vy
    );


  const dirX =
    vx /
    Math.max(
      velocity,
      .001
    );

  const dirY =
    vy /
    Math.max(
      velocity,
      .001
    );


  const strength =
    clamp(
      Number(
        gesture.strength ||
        1
      ),
      .65,
      2.4
    );


  const limits =
    stageLimits();


  /*
    Gesture classification.

    These intentionally behave
    very differently.
  */

  const upwardAmount =
    clamp(
      -dirY,
      0,
      1
    );

  const downwardAmount =
    clamp(
      dirY,
      0,
      1
    );

  const sidewaysAmount =
    Math.abs(
      dirX
    );


  /*
    Horizontal travel is based
    mainly on the actual gesture.
  */

  let travelX =
    dirX *
    (
      65 +
      strength*95
    );


  /*
    Vertical travel depends on
    the direction rather than
    automatically becoming
    an upward toss.
  */

  let travelY =
    dirY *
    (
      35 +
      strength*48
    );


  /*
    Sideways flick:
    really travel sideways.

    Minimal vertical change.
  */

  if(
    sidewaysAmount > .72 &&
    Math.abs(dirY) < .55
  ){

    travelX =
      dirX *
      (
        105 +
        strength*115
      );

    travelY =
      dirY *
      (
        22 +
        strength*25
      );

  }


  /*
    Downward:
    preserve the downward
    direction strongly.
  */

  if(
    downwardAmount > .58
  ){

    travelY =
      dirY *
      (
        70 +
        strength*75
      );

  }


  /*
    Upward:
    traditional toss has much
    more vertical distance.
  */

  if(
    upwardAmount > .58
  ){

    travelY =
      dirY *
      (
        75 +
        strength*90
      );

  }


  const startX =
    coinPos.x;

  const startY =
    coinPos.y;


  let targetX =
    clamp(
      startX +
      travelX,
      -limits.x,
      limits.x
    );


  let targetY =
    clamp(
      startY +
      travelY,
      -limits.y,
      limits.y
    );


  /*
    Rotation.
  */

  const contactBias =
    clamp(
      Number(
        gesture.spinBias ||
        0
      ),
      -1,
      1
    );


  let spinDirection =
    Math.sign(
      vx*.8 +
      contactBias
    );


  if(
    spinDirection === 0
  ){

    spinDirection =
      secureFloat(
        0,
        1
      ) < .5
        ? -1
        : 1;

  }


  const startRotation =
    currentFace ===
    'tails'
      ? 180
      : 0;


  const turns =
    Math.round(
      secureFloat(
        4,
        7
      ) +
      strength*1.7
    );


  const faceChange =
    outcome ===
    currentFace
      ? 0
      : 180;


  const endRotation =
    startRotation +
    spinDirection *
    (
      turns*360 +
      faceChange
    );


  /*
    Duration depends on
    throw strength.
  */

  const duration =
    clamp(
      980 +
      strength*260 +
      secureFloat(
        -100,
        130
      ),
      1000,
      1700
    );


  /*
    ANGLE-SPECIFIC PATHS
  */

  let path;


  /*
    DOWNWARD THROW

    Dive first,
    hit low,
    rebound upward,
    then settle.
  */

  if(
    downwardAmount > .58
  ){

    const diveX =
      startX +
      (
        targetX -
        startX
      )*.66;


    const diveY =
      clamp(
        startY +
        (
          75 +
          strength*80
        ),
        -limits.y,
        limits.y
      );


    const reboundY =
      clamp(
        targetY -
        (
          28 +
          strength*25
        ),
        -limits.y,
        limits.y
      );


    path = [

      {
        transform:
          `translate3d(
            ${startX}px,
            ${startY}px,
            0
          )`,
        offset:0
      },

      {
        transform:
          `translate3d(
            ${diveX}px,
            ${diveY}px,
            0
          )`,
        offset:.38
      },

      {
        transform:
          `translate3d(
            ${targetX}px,
            ${reboundY}px,
            0
          )`,
        offset:.68
      },

      {
        transform:
          `translate3d(
            ${targetX}px,
            ${targetY}px,
            0
          )`,
        offset:1
      }

    ];

  }


  /*
    SIDEWAYS THROW

    Travels wide and low.

    Only a small hop.
  */

  else if(
    sidewaysAmount > .72 &&
    Math.abs(dirY) < .55
  ){

    const hop =
      38 +
      strength*28;


    const midX =
      startX +
      (
        targetX -
        startX
      )*.53;


    const midY =
      clamp(
        startY -
        hop,
        -limits.y,
        limits.y
      );


    path = [

      {
        transform:
          `translate3d(
            ${startX}px,
            ${startY}px,
            0
          )`,
        offset:0
      },

      {
        transform:
          `translate3d(
            ${midX}px,
            ${midY}px,
            0
          )`,
        offset:.47
      },

      {
        transform:
          `translate3d(
            ${targetX}px,
            ${targetY}px,
            0
          )`,
        offset:1
      }

    ];

  }


  /*
    UPWARD THROW

    Traditional high coin arc.
  */

  else if(
    upwardAmount > .58
  ){

    const rise =
      125 +
      strength*85;


    const apexX =
      startX +
      (
        targetX -
        startX
      )*.42;


    const apexY =
      clamp(
        startY -
        rise,
        -limits.y,
        limits.y
      );


    path = [

      {
        transform:
          `translate3d(
            ${startX}px,
            ${startY}px,
            0
          )`,
        offset:0
      },

      {
        transform:
          `translate3d(
            ${apexX}px,
            ${apexY}px,
            0
          )`,
        offset:.46
      },

      {
        transform:
          `translate3d(
            ${targetX}px,
            ${targetY}px,
            0
          )`,
        offset:1
      }

    ];

  }


  /*
    DIAGONAL

    Follows the actual gesture
    direction.

    Small perpendicular arc
    keeps it feeling physical
    without forcing it upward.
  */

  else{

    const perpendicularX =
      -dirY;


    const perpendicularY =
      dirX;


    const arcStrength =
      secureFloat(
        22,
        46
      ) *
      (
        .8 +
        strength*.25
      );


    const midX =
      startX +
      (
        targetX -
        startX
      )*.52 +
      perpendicularX *
      arcStrength;


    const midY =
      startY +
      (
        targetY -
        startY
      )*.52 +
      perpendicularY *
      arcStrength;


    path = [

      {
        transform:
          `translate3d(
            ${startX}px,
            ${startY}px,
            0
          )`,
        offset:0
      },

      {
        transform:
          `translate3d(
            ${midX}px,
            ${midY}px,
            0
          )`,
        offset:.5
      },

      {
        transform:
          `translate3d(
            ${targetX}px,
            ${targetY}px,
            0
          )`,
        offset:1
      }

    ];

  }


  /*
    Animate travel.
  */

  coinWrap.animate(
    path,
    {
      duration,
      easing:
        'cubic-bezier(.16,.68,.22,1)',
      fill:'forwards'
    }
  );


  /*
    Coin rotation / wobble.
  */

  const wobbleX =
    secureFloat(
      -48,
      48
    );


  const wobbleZ =
    clamp(
      dirX*36 +
      contactBias*18 +
      secureFloat(
        -8,
        8
      ),
      -55,
      55
    );


  coin.animate(
    [

      {
        transform:
          `rotateY(
            ${startRotation}deg
          )
          rotateX(0deg)
          rotateZ(0deg)`,
        offset:0
      },

      {
        transform:
          `rotateY(
            ${
              startRotation +
              (
                endRotation -
                startRotation
              )*.48
            }deg
          )
          rotateX(
            ${wobbleX}deg
          )
          rotateZ(
            ${wobbleZ}deg
          )`,
        offset:.48
      },

      {
        transform:
          `rotateY(
            ${
              startRotation +
              (
                endRotation -
                startRotation
              )*.90
            }deg
          )
          rotateX(
            ${wobbleX*.16}deg
          )
          rotateZ(
            ${wobbleZ*.12}deg
          )`,
        offset:.89
      },

      {
        transform:
          `rotateY(
            ${endRotation}deg
          )
          rotateX(0deg)
          rotateZ(0deg)`,
        offset:1
      }

    ],
    {
      duration,
      easing:
        'cubic-bezier(.12,.54,.20,1)',
      fill:'forwards'
    }
  );


  /*
    Shadow follows horizontal/
    vertical travel while shrinking
    when the coin gains height.
  */

  const shadowMidX =
    startX +
    (
      targetX -
      startX
    )*.5;


  const shadowMidY =
    startY +
    (
      targetY -
      startY
    )*.5;


  const highThrow =
    upwardAmount > .58;


  shadow.animate(
    [

      {
        transform:
          `translate(
            calc(
              -50% +
              ${startX}px
            ),
            ${startY}px
          )
          scale(1)`,
        opacity:.72
      },

      {
        transform:
          `translate(
            calc(
              -50% +
              ${shadowMidX}px
            ),
            ${shadowMidY}px
          )
          scale(
            ${
              highThrow
                ? .48
                : .70
            }
          )`,
        opacity:
          highThrow
            ? .20
            : .40,
        offset:.5
      },

      {
        transform:
          `translate(
            calc(
              -50% +
              ${targetX}px
            ),
            ${targetY}px
          )
          scale(1)`,
        opacity:.72
      }

    ],
    {
      duration,
      easing:'ease-in-out',
      fill:'forwards'
    }
  );


  launchSound();


  await wait(
    duration*.87
  );


  clink(
    clamp(
      .85 +
      strength*.20,
      .85,
      1.4
    )
  );


  vibrate(
    [
      20,
      28,
      10
    ]
  );


  await wait(
    duration*.13
  );


  /*
    Landing bounce continues
    in the direction of travel.
  */

  const bounceDistance =
    5 +
    strength*3;


  const bounceX =
    clamp(
      targetX +
      dirX*bounceDistance,
      -limits.x,
      limits.x
    );


  const bounceY =
    clamp(
      targetY -
      (
        8 +
        strength*5
      ),
      -limits.y,
      limits.y
    );


  coinWrap.animate(
    [

      {
        transform:
          `translate3d(
            ${targetX}px,
            ${targetY}px,
            0
          )`
      },

      {
        transform:
          `translate3d(
            ${bounceX}px,
            ${bounceY}px,
            0
          )`,
        offset:.35
      },

      {
        transform:
          `translate3d(
            ${targetX}px,
            ${targetY}px,
            0
          )`
      }

    ],
    {
      duration:250,
      easing:'ease-out',
      fill:'forwards'
    }
  );


  if(
    strength >
    1.25
  ){

    await wait(95);

    clink(.30);

    vibrate(8);

    await wait(155);

  }
  else{

    await wait(250);

  }


  /*
    Commit final physical position.
  */

  coinPos.x =
    targetX;

  coinPos.y =
    targetY;

  currentFace =
    outcome;


  cancelAnimations();

  setRestingPosition();


  /*
    RESULTS
  */

  if(
    mode ===
    'single'
  ){

    showResult(
      outcome
    );

    flipping =
      false;

    hint.style.opacity =
      '1';

    return;

  }


  series[outcome]++;

  updateScore();


  if(
    series[outcome] >= 2
  ){

    showResult(
      `${outcome} wins`,
      'Best of 3'
    );

    series = {
      heads:0,
      tails:0
    };

    await wait(1000);

    updateScore();

    flipping =
      false;

    hint.style.opacity =
      '1';

    return;

  }


  showResult(
    outcome,
    `${series.heads}–${series.tails}`
  );


  await wait(650);

  clearResult();

  flipping =
    false;


  await wait(180);


  /*
    Next best-of-three throw
    gets a genuinely different
    random direction.
  */

  const randomAngle =
    secureFloat(
      0,
      Math.PI*2
    );


  return doFlip({

    vx:
      Math.cos(
        randomAngle
      ),

    vy:
      Math.sin(
        randomAngle
      ),

    strength:
      secureFloat(
        .85,
        1.4
      ),

    spinBias:
      secureFloat(
        -.4,
        .4
      )

  });

}


/*
  TOUCH / FLICK INPUT
*/

let drag =
  null;


function hitTestCoin(
  x,
  y
){

  const rect =
    coinWrap
      .getBoundingClientRect();

  const cx =
    rect.left +
    rect.width/2;

  const cy =
    rect.top +
    rect.height/2;

  const radius =
    Math.min(
      rect.width,
      rect.height
    )*.54;


  return {

    inside:
      Math.hypot(
        x-cx,
        y-cy
      ) <= radius,

    cx,
    cy,
    radius

  };

}


stage.addEventListener(
  'pointerdown',
  event => {

    if(flipping){
      return;
    }

    const hit =
      hitTestCoin(
        event.clientX,
        event.clientY
      );

    if(!hit.inside){
      return;
    }


    try{

      stage
        .setPointerCapture(
          event.pointerId
        );

    }
    catch(_){}


    const now =
      performance.now();


    drag = {

      id:
        event.pointerId,

      startX:
        event.clientX,

      startY:
        event.clientY,

      startTime:
        now,

      centerX:
        hit.cx,

      centerY:
        hit.cy,

      radius:
        hit.radius,

      samples:[
        {
          x:event.clientX,
          y:event.clientY,
          time:now
        }
      ]

    };


    coinWrap
      .classList
      .add(
        'dragging'
      );

  }
);


stage.addEventListener(
  'pointermove',
  event => {

    if(
      !drag ||
      event.pointerId !==
      drag.id ||
      flipping
    ){

      return;

    }


    const now =
      performance.now();


    const dx =
      event.clientX -
      drag.startX;


    const dy =
      event.clientY -
      drag.startY;


    /*
      Coin gives under your finger
      in the actual drag direction.
    */

    const previewX =
      clamp(
        dx*.20,
        -46,
        46
      );


    const previewY =
      clamp(
        dy*.20,
        -46,
        46
      );


    const twist =
      clamp(
        dx*.07,
        -16,
        16
      );


    coinWrap.style.transform =
      `translate3d(
        ${coinPos.x + previewX}px,
        ${coinPos.y + previewY}px,
        0
      )
      rotateZ(
        ${twist}deg
      )`;


    shadow.style.transform =
      `translate(
        calc(
          -50% +
          ${coinPos.x + previewX*.7}px
        ),
        ${coinPos.y + previewY*.3}px
      )`;


    drag.samples.push({

      x:
        event.clientX,

      y:
        event.clientY,

      time:
        now

    });


    /*
      Keep recent movement so the
      release direction comes from
      the actual flick, not the entire
      slow drag.
    */

    while(
      drag.samples.length > 2 &&
      now -
      drag.samples[0].time >
      100
    ){

      drag.samples.shift();

    }

  }
);


function finishGesture(
  event,
  cancelled=false
){

  if(
    !drag ||
    event.pointerId !==
    drag.id
  ){

    return;

  }


  const gesture =
    drag;

  drag =
    null;


  coinWrap
    .classList
    .remove(
      'dragging'
    );


  setRestingPosition();


  if(
    cancelled ||
    flipping
  ){

    return;

  }


  const endTime =
    performance.now();


  const dx =
    event.clientX -
    gesture.startX;


  const dy =
    event.clientY -
    gesture.startY;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  const oldest =
    gesture.samples[0];


  const velocityTime =
    Math.max(
      16,
      endTime -
      oldest.time
    );


  let vx =
    (
      event.clientX -
      oldest.x
    ) /
    velocityTime;


  let vy =
    (
      event.clientY -
      oldest.y
    ) /
    velocityTime;


  /*
    If someone does a slower,
    deliberate swipe, use the
    overall displacement so it
    still travels correctly.
  */

  if(
    Math.hypot(
      vx,
      vy
    ) < .12 &&
    distance > 12
  ){

    const totalTime =
      Math.max(
        40,
        endTime -
        gesture.startTime
      );

    vx =
      dx /
      totalTime;

    vy =
      dy /
      totalTime;

  }


  const speed =
    Math.hypot(
      vx,
      vy
    );


  /*
    Contact point determines
    torque visually.
  */

  const contactX =
    clamp(
      (
        gesture.startX -
        gesture.centerX
      ) /
      gesture.radius,
      -1,
      1
    );


  const contactY =
    clamp(
      (
        gesture.startY -
        gesture.centerY
      ) /
      gesture.radius,
      -1,
      1
    );


  const edgeAmount =
    clamp(
      Math.hypot(
        contactX,
        contactY
      ),
      0,
      1
    );


  const spinBias =
    clamp(
      contactX -
      contactY*.15,
      -1,
      1
    );


  /*
    ANY direction counts.
  */

  if(
    distance >= 12 ||
    speed >= .14
  ){

    const strength =
      clamp(
        .72 +
        speed*1.0 +
        Math.min(
          distance,
          260
        ) / 320,
        .72,
        2.4
      );


    doFlip({

      vx,
      vy,
      strength,
      spinBias

    });

    return;

  }


  /*
    Simple tap.

    Edge taps create more torque.
  */

  doFlip({

    vx:
      contactX *
      secureFloat(
        .18,
        .48
      ),

    vy:
      -secureFloat(
        .55,
        .95
      ) +
      contactY*.15,

    strength:
      .76 +
      edgeAmount*.25,

    spinBias

  });

}


stage.addEventListener(
  'pointerup',
  event =>
    finishGesture(
      event,
      false
    )
);


stage.addEventListener(
  'pointercancel',
  event =>
    finishGesture(
      event,
      true
    )
);


/*
  BUTTON FALLBACK
*/

flipBtn.addEventListener(
  'click',
  () => {

    const angle =
      secureFloat(
        0,
        Math.PI*2
      );


    doFlip({

      vx:
        Math.cos(angle),

      vy:
        Math.sin(angle),

      strength:
        secureFloat(
          .85,
          1.25
        ),

      spinBias:
        secureFloat(
          -.4,
          .4
        )

    });

  }
);


/*
  MODES
*/

singleBtn.addEventListener(
  'click',
  () =>
    setMode(
      'single'
    )
);


bo3Btn.addEventListener(
  'click',
  () =>
    setMode(
      'bo3'
    )
);


/*
  SOUND
*/

soundBtn.addEventListener(
  'click',
  () => {

    soundOn =
      !soundOn;


    soundBtn.textContent =
      soundOn
        ? 'Sound On'
        : 'Sound Off';


    if(soundOn){

      ensureAudio();

      tone(
        520,
        .06,
        .03
      );

    }

  }
);


/*
  SHAKE SUPPORT
*/

function triggerShake(
  strength=1
){

  if(flipping){
    return;
  }


  const now =
    performance.now();


  if(
    now -
    lastShake <
    800
  ){

    return;

  }


  lastShake =
    now;


  /*
    Random travel direction,
    since a shake doesn't have
    one clean swipe vector.
  */

  const angle =
    secureFloat(
      0,
      Math.PI*2
    );


  doFlip({

    vx:
      Math.cos(angle),

    vy:
      Math.sin(angle),

    strength:
      clamp(
        strength,
        .9,
        1.9
      ),

    spinBias:
      secureFloat(
        -.4,
        .4
      )

  });

}


function processAcceleration(
  x,
  y,
  z
){

  const magnitude =
    Math.sqrt(
      x*x +
      y*y +
      z*z
    );


  const jerk =
    Math.abs(
      magnitude -
      lastMagnitude
    );


  const gravityDelta =
    Math.abs(
      magnitude -
      9.81
    );


  lastMagnitude =
    magnitude;


  motionSamples++;


  if(
    motionSamples === 1
  ){

    motionEnabled =
      true;


    motionBtn.textContent =
      'Shake On';


    statusEl.textContent =
      'Shake ready · motion sensor connected';


    if(motionTimer){

      clearTimeout(
        motionTimer
      );

    }

  }


  if(
    jerk > 5.4 ||
    gravityDelta > 7
  ){

    triggerShake(

      Math.max(
        .9,
        Math.min(
          1.9,
          Math.max(
            jerk,
            gravityDelta
          ) /
          7
        )
      )

    );

  }

}


function deviceMotionHandler(
  event
){

  const a =
    event.accelerationIncludingGravity ||
    event.acceleration;


  if(
    !a ||
    a.x == null ||
    a.y == null ||
    a.z == null
  ){

    return;

  }


  processAcceleration(

    Number(a.x),

    Number(a.y),

    Number(a.z)

  );

}


async function startGenericAccelerometer(){

  if(
    !(
      'Accelerometer'
      in window
    )
  ){

    return false;

  }


  try{

    if(
      navigator.permissions &&
      navigator.permissions.query
    ){

      try{

        const permission =
          await navigator.permissions.query({
            name:
              'accelerometer'
          });


        if(
          permission.state ===
          'denied'
        ){

          return false;

        }

      }
      catch(_){}

    }


    const sensor =
      new Accelerometer({
        frequency:40
      });


    sensor.addEventListener(
      'reading',
      () => {

        processAcceleration(

          Number(
            sensor.x || 0
          ),

          Number(
            sensor.y || 0
          ),

          Number(
            sensor.z || 0
          )

        );

      }
    );


    sensor.start();


    window.coinAccelerometer =
      sensor;


    return true;

  }
  catch(_){

    return false;

  }

}


async function enableMotion(){

  motionSamples =
    0;

  motionEnabled =
    false;


  motionBtn.textContent =
    'Testing…';


  statusEl.textContent =
    'Waiting for Android motion data…';


  if(
    !window.isSecureContext
  ){

    motionBtn.textContent =
      'Needs HTTPS';


    statusEl.textContent =
      'Shake requires the GitHub Pages HTTPS version.';


    return;

  }


  let deviceMotionStarted =
    false;


  try{

    if(
      'DeviceMotionEvent'
      in window
    ){

      if(
        typeof
        DeviceMotionEvent
          .requestPermission ===
        'function'
      ){

        const permission =
          await
          DeviceMotionEvent
            .requestPermission();


        if(
          permission ===
          'granted'
        ){

          window.addEventListener(
            'devicemotion',
            deviceMotionHandler,
            {
              passive:true
            }
          );


          deviceMotionStarted =
            true;

        }

      }
      else{

        window.addEventListener(
          'devicemotion',
          deviceMotionHandler,
          {
            passive:true
          }
        );


        deviceMotionStarted =
          true;

      }

    }

  }
  catch(_){}


  const genericStarted =
    await
    startGenericAccelerometer();


  motionTimer =
    setTimeout(
      () => {

        if(
          motionSamples === 0
        ){

          motionEnabled =
            false;


          motionBtn.textContent =
            'Shake Blocked';


          statusEl.textContent =
            'No sensor data received. Open the GitHub Pages URL directly in Chrome and allow Motion sensors.';

        }

      },
      2500
    );


  if(
    !deviceMotionStarted &&
    !genericStarted
  ){

    /*
      Timer above gives the
      useful message.
    */

  }

}


motionBtn.addEventListener(
  'click',
  () => {

    if(
      !motionEnabled
    ){

      enableMotion();

    }

  }
);


/*
  QUARTER IMAGE ERRORS
*/

document
  .querySelectorAll(
    '.quarter-photo'
  )
  .forEach(
    image => {

      image.addEventListener(
        'error',
        () => {

          statusEl.textContent =
            'Could not load the quarter image. Check your connection.';

        }
      );

    }
  );


/*
  Prevent browser scrolling
  while physically flicking
  the coin.
*/

stage.addEventListener(
  'touchmove',
  event =>
    event.preventDefault(),
  {
    passive:false
  }
);


setRestingPosition();

})();
</script>
