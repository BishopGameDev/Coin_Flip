<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Coin Flip</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0f1115;
    --panel:#171a20;
    --panel2:#1d2129;
    --text:#f5f7fb;
    --muted:#9ba3b0;
    --line:#2b313d;
    --accent:#d6d9df;
    --shadow:rgba(0,0,0,.45);
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    overflow:hidden;
  }

  body{
    overscroll-behavior:none;
    touch-action:manipulation;
  }

  .app{
    height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);
    gap:12px;
    background:
      radial-gradient(circle at 50% 38%,rgba(255,255,255,.05),transparent 30%),
      linear-gradient(180deg,#101319,#0c0e12);
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .title{
    font-weight:750;
    letter-spacing:.2px;
    font-size:19px;
  }

  .mode{
    display:flex;
    background:var(--panel);
    border:1px solid var(--line);
    padding:4px;
    border-radius:14px;
    gap:4px;
  }

  .mode button,.iconbtn{
    border:0;
    color:var(--muted);
    background:transparent;
    border-radius:10px;
    padding:9px 12px;
    font-weight:700;
    font-size:13px;
  }

  .mode button.active{
    background:var(--panel2);
    color:var(--text);
    box-shadow:0 3px 12px rgba(0,0,0,.22);
  }

  .stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    perspective:1100px;
    touch-action:none;
    user-select:none;
  }

  .hint{
    position:absolute;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    color:var(--muted);
    font-size:14px;
    text-align:center;
    width:min(92%,460px);
    line-height:1.35;
    transition:opacity .25s;
  }

  .score{
    position:absolute;
    top:15%;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
    color:var(--muted);
    font-weight:700;
    letter-spacing:.3px;
    opacity:0;
    transition:opacity .2s;
  }

  .score.show{
    opacity:1;
  }

  .coin-wrap{
    position:relative;
    width:210px;
    height:210px;
    transform-style:preserve-3d;
    will-change:transform;
    cursor:grab;
  }

  .coin-wrap.dragging{
    cursor:grabbing;
  }

  .coin{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    border-radius:50%;
    will-change:transform;
  }

  .face,.edge{
    position:absolute;
    inset:0;
    border-radius:50%;
    backface-visibility:hidden;
  }

  .face{
    overflow:hidden;
    border:3px solid #aeb3bc;
    background:
      radial-gradient(circle at 31% 24%,rgba(255,255,255,.95) 0 3%,rgba(245,246,248,.72) 7%,transparent 18%),
      radial-gradient(circle at 65% 72%,rgba(70,74,81,.22),transparent 28%),
      repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.045) 0 1px,rgba(0,0,0,.028) 1px 2px,transparent 2px 4px),
      linear-gradient(145deg,#f1f2f4 0%,#c8ccd2 18%,#9298a2 41%,#dadde2 61%,#a2a7af 78%,#d4d7dc 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.62),
      inset 0 0 0 7px rgba(74,79,88,.22),
      inset 0 0 20px rgba(0,0,0,.16),
      inset -17px -22px 24px rgba(34,38,44,.24),
      inset 15px 14px 18px rgba(255,255,255,.19),
      0 20px 34px rgba(0,0,0,.42);
  }

  .face:after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    pointer-events:none;
    border:1px solid rgba(75,80,87,.38);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
  }

  .heads{
    transform:translateZ(8px);
  }

  .tails{
    transform:rotateY(180deg) translateZ(8px);
  }

  .face.real-quarter{
    background:#d8dadd;
    padding:0;
  }

  .face.real-quarter:after{
    display:none;
  }

  .quarter-photo{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    transform:scale(1.015);
    filter:contrast(1.04) brightness(.98);
    user-select:none;
    pointer-events:none;
  }

  .edge{
    transform:translateZ(0);
    background:repeating-linear-gradient(
      90deg,
      #6d737c 0 1px,
      #d7dae0 1px 2px,
      #878d96 2px 3px,
      #c6cad0 3px 4px
    );
    border:8px solid #8d939c;
    box-shadow:inset 0 0 8px rgba(0,0,0,.28);
  }

  .shadow{
    position:absolute;
    left:50%;
    top:calc(50% + 135px);
    width:150px;
    height:34px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(
      ellipse,
      rgba(0,0,0,.52),
      rgba(0,0,0,0) 70%
    );
    filter:blur(6px);
    opacity:.72;
    transition:opacity .15s,transform .15s;
  }

  .result{
    position:absolute;
    bottom:8%;
    left:50%;
    transform:translateX(-50%) translateY(8px);
    font-size:28px;
    font-weight:850;
    letter-spacing:.6px;
    opacity:0;
    transition:opacity .22s,transform .22s;
    text-align:center;
  }

  .result.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .result small{
    display:block;
    font-size:13px;
    color:var(--muted);
    font-weight:700;
    margin-top:5px;
    letter-spacing:.4px;
  }

  .controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }

  .pill{
    min-width:0;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:16px;
    padding:13px 16px;
    font-weight:800;
    font-size:14px;
  }

  .pill:active{
    transform:scale(.98);
  }

  .pill.secondary{
    color:var(--muted);
  }

  .status{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:5px;
    min-height:16px;
  }

  @media (max-height:650px){
    .coin-wrap{
      width:165px;
      height:165px;
    }

    .shadow{
      top:calc(50% + 105px);
    }

    .result{
      bottom:3%;
    }

    .hint{
      top:2%;
    }
  }
</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="title">Coin Flip</div>

    <div class="mode" aria-label="Flip mode">
      <button id="singleBtn" class="active">Single</button>
      <button id="bo3Btn">Best of 3</button>
    </div>
  </div>

  <main class="stage" id="stage">

    <div class="hint" id="hint">
      Flick it any direction, tap it, or shake your phone
    </div>

    <div class="score" id="score">
      Heads 0 · Tails 0
    </div>

    <div class="shadow" id="shadow"></div>

    <div class="coin-wrap" id="coinWrap">
      <div class="coin" id="coin">

        <div class="face heads real-quarter">
          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg"
            alt="Heads — 2021 U.S. quarter obverse"
            draggable="false"
          >
        </div>

        <div class="face tails real-quarter">
          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/e/eb/United_States_Quarter_Reverse_2021.jpg"
            alt="Tails — 2021 U.S. quarter reverse"
            draggable="false"
          >
        </div>

        <div class="edge"></div>

      </div>
    </div>

    <div class="result" id="result"></div>

  </main>

  <div>

    <div class="controls">

      <button class="pill secondary" id="motionBtn">
        Enable Shake
      </button>

      <button class="pill" id="flipBtn">
        Flip
      </button>

      <button class="pill secondary" id="soundBtn">
        Sound On
      </button>

    </div>

    <div class="status" id="status">
      Secure 50/50 randomness · tap Enable Shake to test your sensor
    </div>

  </div>

</div>

<script>
(() => {

  const stage = document.getElementById('stage');
  const coinWrap = document.getElementById('coinWrap');
  const coin = document.getElementById('coin');
  const shadow = document.getElementById('shadow');

  const resultEl = document.getElementById('result');
  const scoreEl = document.getElementById('score');
  const hint = document.getElementById('hint');

  const singleBtn = document.getElementById('singleBtn');
  const bo3Btn = document.getElementById('bo3Btn');
  const motionBtn = document.getElementById('motionBtn');
  const flipBtn = document.getElementById('flipBtn');
  const soundBtn = document.getElementById('soundBtn');

  const statusEl = document.getElementById('status');

  let mode = 'single';
  let flipping = false;
  let soundOn = true;

  let motionEnabled = false;
  let lastShake = 0;
  let lastAccel = {x:0,y:0,z:0};

  let audioCtx = null;

  let series = {
    heads:0,
    tails:0
  };

  function secureBit(){

    const array = new Uint32Array(1);

    crypto.getRandomValues(array);

    return (array[0] & 1) === 0
      ? 'heads'
      : 'tails';

  }

  function secureFloat(min,max){

    const array = new Uint32Array(1);

    crypto.getRandomValues(array);

    return min +
      (array[0] / 4294967295) *
      (max-min);

  }

  function vibrate(pattern){

    if(navigator.vibrate){
      navigator.vibrate(pattern);
    }

  }

  function ensureAudio(){

    if(!audioCtx){

      audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }

    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }

  }

  function tone(
    freq,
    duration,
    gain=.05,
    delay=0,
    type='sine'
  ){

    if(!soundOn) return;

    ensureAudio();

    const start =
      audioCtx.currentTime + delay;

    const osc =
      audioCtx.createOscillator();

    const volume =
      audioCtx.createGain();

    const filter =
      audioCtx.createBiquadFilter();

    osc.frequency.setValueAtTime(
      freq,
      start
    );

    osc.frequency.exponentialRampToValueAtTime(
      Math.max(80,freq*.78),
      start + duration
    );

    osc.type = type;

    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = 4.5;

    volume.gain.setValueAtTime(
      Math.max(.0001,gain),
      start
    );

    volume.gain.exponentialRampToValueAtTime(
      .0001,
      start + duration
    );

    osc
      .connect(filter)
      .connect(volume)
      .connect(audioCtx.destination);

    osc.start(start);

    osc.stop(
      start +
      duration +
      .02
    );

  }

  function noiseTick(
    duration=.035,
    gain=.035,
    delay=0
  ){

    if(!soundOn) return;

    ensureAudio();

    const sampleRate =
      audioCtx.sampleRate;

    const buffer =
      audioCtx.createBuffer(
        1,
        Math.max(
          1,
          Math.floor(
            sampleRate * duration
          )
        ),
        sampleRate
      );

    const data =
      buffer.getChannelData(0);

    for(
      let i=0;
      i<data.length;
      i++
    ){

      data[i] =
        (Math.random()*2-1) *
        Math.pow(
          1-i/data.length,
          2.4
        );

    }

    const source =
      audioCtx.createBufferSource();

    const highpass =
      audioCtx.createBiquadFilter();

    const volume =
      audioCtx.createGain();

    highpass.type = 'highpass';
    highpass.frequency.value = 1700;

    volume.gain.value = gain;

    source.buffer = buffer;

    source
      .connect(highpass)
      .connect(volume)
      .connect(audioCtx.destination);

    source.start(
      audioCtx.currentTime +
      delay
    );

  }

  function clink(intensity=1){

    const randomPitch =
      .92 +
      secureFloat(0,.16);

    noiseTick(
      .028,
      .028*intensity,
      0
    );

    tone(
      510*randomPitch,
      .10,
      .040*intensity,
      0,
      'sine'
    );

    tone(
      940*randomPitch,
      .075,
      .026*intensity,
      .006,
      'sine'
    );

    tone(
      1460*randomPitch,
      .055,
      .017*intensity,
      .012,
      'sine'
    );

    tone(
      265*randomPitch,
      .13,
      .016*intensity,
      .018,
      'triangle'
    );

  }

  function launchSound(){

    noiseTick(
      .018,
      .012,
      0
    );

    tone(
      180,
      .07,
      .012,
      0,
      'triangle'
    );

  }

  function setMode(next){

    if(flipping) return;

    mode = next;

    singleBtn.classList.toggle(
      'active',
      mode === 'single'
    );

    bo3Btn.classList.toggle(
      'active',
      mode === 'bo3'
    );

    scoreEl.classList.toggle(
      'show',
      mode === 'bo3'
    );

    series = {
      heads:0,
      tails:0
    };

    updateScore();

    clearResult();

  }

  function updateScore(){

    scoreEl.textContent =
      `Heads ${series.heads} · Tails ${series.tails}`;

  }

  function clearResult(){

    resultEl.classList.remove(
      'show'
    );

    setTimeout(()=>{

      resultEl.innerHTML='';

    },220);

  }

  function showResult(
    text,
    sub=''
  ){

    resultEl.innerHTML =
      `${text.toUpperCase()}${
        sub
          ? `<small>${sub}</small>`
          : ''
      }`;

    resultEl.classList.add(
      'show'
    );

  }

  function wait(ms){

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }

  let currentFace = 'heads';

  function clampNum(
    value,
    min,
    max
  ){

    return Math.max(
      min,
      Math.min(
        max,
        value
      )
    );

  }

  function clearMotionAnimations(){

    [
      coinWrap,
      coin,
      shadow
    ].forEach(element=>{

      element
        .getAnimations()
        .forEach(animation=>
          animation.cancel()
        );

    });

    coinWrap.style.transform = '';

    shadow.style.transform = '';
    shadow.style.opacity = '';

    coin.style.transform =
      `rotateY(${
        currentFace === 'tails'
          ? 180
          : 0
      }deg)`;

  }

  async function doFlip(
    gesture={
      vx:0,
      vy:-1.1,
      strength:1,
      spinBias:0
    }
  ){

    if(flipping) return;

    flipping = true;

    clearResult();

    hint.style.opacity = .15;

    coinWrap.classList.remove(
      'dragging'
    );

    /*
      Heads/tails is decided HERE,
      before animation physics.

      Gesture direction does NOT
      influence the outcome.
    */

    const outcome =
      secureBit();

    const vx =
      clampNum(
        Number(
          gesture.vx || 0
        ),
        -3.2,
        3.2
      );

    const vy =
      clampNum(
        Number(
          gesture.vy || 0
        ),
        -3.2,
        3.2
      );

    const strength =
      clampNum(
        Number(
          gesture.strength || 1
        ),
        .65,
        2.25
      );

    const speed =
      Math.hypot(
        vx,
        vy
      );

    const dirX =
      speed > .03
        ? vx /
          Math.max(
            speed,
            .001
          )
        : secureFloat(
            -.35,
            .35
          );

    const dirY =
      speed > .03
        ? vy /
          Math.max(
            speed,
            .001
          )
        : -1;

    /*
      Upward = higher arc.

      Sideways = lower but stronger
      lateral travel.

      Downward still works and gets
      a shorter aggressive pop.
    */

    const upward =
      clampNum(
        -dirY,
        0,
        1
      );

    const downward =
      clampNum(
        dirY,
        0,
        1
      );

    const rise =
      secureFloat(
        145,
        215
      ) *
      (
        .80 +
        strength*.34
      ) *
      (
        1 +
        upward*.28 -
        downward*.12
      );

    const lateralScale =
      secureFloat(
        55,
        105
      ) *
      (
        .75 +
        strength*.32
      );

    const landX =
      clampNum(
        dirX *
        lateralScale,
        -145,
        145
      );

    const landY =
      clampNum(
        dirY *
        secureFloat(
          18,
          52
        ) *
        (
          .65 +
          strength*.18
        ),
        -65,
        65
      );

    /*
      Add curvature so horizontal
      and diagonal tosses don't just
      look like rotated vertical flips.
    */

    const curve =
      secureFloat(
        -34,
        34
      );

    const apexX =
      landX*.44 +
      curve;

    const apexY =
      -rise +
      landY*.12;

    const lateX =
      landX*.92;

    const lateY =
      landY -
      secureFloat(
        8,
        18
      );

    const tapBias =
      clampNum(
        Number(
          gesture.spinBias ||
          0
        ),
        -1,
        1
      );

    let spinSign =
      Math.sign(
        vx*.75 +
        tapBias*.9
      );

    if(spinSign === 0){

      spinSign =
        secureFloat(
          0,
          1
        ) < .5
          ? -1
          : 1;

    }

    const startY =
      currentFace === 'tails'
        ? 180
        : 0;

    const turns =
      Math.round(
        secureFloat(
          4.5,
          7.5
        ) +
        strength*1.7
      );

    const faceDelta =
      outcome === currentFace
        ? 0
        : 180;

    const endY =
      startY +
      spinSign *
      (
        turns*360 +
        faceDelta
      );

    const throwTiltX =
      clampNum(
        -dirY*24 +
        secureFloat(
          -12,
          12
        ),
        -38,
        38
      );

    const throwTiltZ =
      clampNum(
        dirX*28 +
        tapBias*14 +
        secureFloat(
          -10,
          10
        ),
        -48,
        48
      );

    const wobble =
      secureFloat(
        -44,
        44
      );

    const duration =
      clampNum(
        secureFloat(
          930,
          1240
        ) +
        rise*.85 +
        strength*80,
        1050,
        1725
      );

    clearMotionAnimations();

    coinWrap.animate(
      [
        {
          transform:
            'translate3d(0,0,0) rotateX(0deg) rotateZ(0deg)',
          offset:0
        },
        {
          transform:
            `translate3d(${apexX}px,${apexY}px,0) rotateX(${throwTiltX}deg) rotateZ(${throwTiltZ}deg)`,
          offset:.46
        },
        {
          transform:
            `translate3d(${lateX}px,${lateY}px,0) rotateX(${throwTiltX*.24}deg) rotateZ(${throwTiltZ*.24}deg)`,
          offset:.87
        },
        {
          transform:
            `translate3d(${landX}px,${landY}px,0) rotateX(0deg) rotateZ(0deg)`,
          offset:1
        }
      ],
      {
        duration,
        easing:
          'cubic-bezier(.16,.70,.20,1)',
        fill:'forwards'
      }
    );

    coin.animate(
      [
        {
          transform:
            `rotateY(${startY}deg) rotateX(0deg) rotateZ(0deg)`,
          offset:0
        },
        {
          transform:
            `rotateY(${startY+(endY-startY)*.47}deg) rotateX(${wobble}deg) rotateZ(${throwTiltZ*.55}deg)`,
          offset:.47
        },
        {
          transform:
            `rotateY(${startY+(endY-startY)*.91}deg) rotateX(${wobble*.18}deg) rotateZ(${throwTiltZ*.12}deg)`,
          offset:.89
        },
        {
          transform:
            `rotateY(${endY}deg) rotateX(0deg) rotateZ(0deg)`,
          offset:1
        }
      ],
      {
        duration,
        easing:
          'cubic-bezier(.12,.54,.20,1)',
        fill:'forwards'
      }
    );

    shadow.animate(
      [
        {
          transform:
            'translate(-50%,0) scale(1)',
          opacity:.72
        },
        {
          transform:
            `translate(calc(-50% + ${apexX*.55}px),${Math.max(-8,landY*.05)}px) scale(.48)`,
          opacity:.18,
          offset:.46
        },
        {
          transform:
            `translate(calc(-50% + ${lateX}px),${landY*.76}px) scale(.88)`,
          opacity:.58,
          offset:.87
        },
        {
          transform:
            `translate(calc(-50% + ${landX}px),${landY}px) scale(1)`,
          opacity:.72
        }
      ],
      {
        duration,
        easing:'ease-in-out',
        fill:'forwards'
      }
    );

    launchSound();

    await wait(
      duration*.86
    );

    clink(
      Math.min(
        1.4,
        .82 +
        strength*.22
      )
    );

    vibrate(
      [20,28,10]
    );

    await wait(
      duration*.14
    );

    currentFace =
      outcome;

    const bounceX =
      landX +
      dirX *
      secureFloat(
        2,
        8
      );

    const bounceY =
      landY -
      secureFloat(
        8,
        15
      );

    coinWrap.animate(
      [
        {
          transform:
            `translate3d(${landX}px,${landY}px,0) scale(1)`
        },
        {
          transform:
            `translate3d(${bounceX}px,${bounceY}px,0) scale(.992)`,
          offset:.34
        },
        {
          transform:
            `translate3d(${landX}px,${landY}px,0) scale(1)`
        }
      ],
      {
        duration:250,
        easing:'ease-out',
        fill:'forwards'
      }
    );

    if(strength > 1.25){

      await wait(95);

      clink(.32);

      vibrate(8);

      await wait(155);

    }else{

      await wait(250);

    }

    if(mode === 'single'){

      showResult(
        outcome
      );

      flipping = false;

      hint.style.opacity = 1;

      return;

    }

    series[outcome]++;

    updateScore();

    if(
      series[outcome] >= 2
    ){

      showResult(
        `${outcome} wins`,
        'Best of 3'
      );

      series = {
        heads:0,
        tails:0
      };

      await wait(1000);

      updateScore();

      flipping = false;

      hint.style.opacity = 1;

      return;

    }

    showResult(
      outcome,
      `${series.heads}–${series.tails}`
    );

    await wait(650);

    clearResult();

    flipping = false;

    await wait(180);

    const angle =
      secureFloat(
        0,
        Math.PI*2
      );

    return doFlip({

      vx:
        Math.cos(angle) *
        secureFloat(
          .55,
          1.25
        ),

      vy:
        Math.sin(angle) *
        secureFloat(
          .55,
          1.25
        ),

      strength:
        secureFloat(
          .85,
          1.35
        ),

      spinBias:
        secureFloat(
          -.35,
          .35
        )

    });

  }

  let drag = null;

  function pointInsideCoin(
    x,
    y
  ){

    const rect =
      coinWrap.getBoundingClientRect();

    const cx =
      rect.left +
      rect.width/2;

    const cy =
      rect.top +
      rect.height/2;

    const radius =
      Math.min(
        rect.width,
        rect.height
      )*.54;

    return {

      inside:
        Math.hypot(
          x-cx,
          y-cy
        ) <= radius,

      cx,
      cy,
      radius

    };

  }

  stage.addEventListener(
    'pointerdown',
    event=>{

      if(flipping) return;

      const hit =
        pointInsideCoin(
          event.clientX,
          event.clientY
        );

      if(!hit.inside) return;

      try{

        stage.setPointerCapture(
          event.pointerId
        );

      }catch(_){}

      const now =
        performance.now();

      drag = {

        id:
          event.pointerId,

        startX:
          event.clientX,

        startY:
          event.clientY,

        startT:
          now,

        lastX:
          event.clientX,

        lastY:
          event.clientY,

        lastT:
          now,

        samples:[
          {
            x:event.clientX,
            y:event.clientY,
            t:now
          }
        ],

        cx:
          hit.cx,

        cy:
          hit.cy,

        radius:
          hit.radius

      };

      coinWrap.classList.add(
        'dragging'
      );

    }
  );

  stage.addEventListener(
    'pointermove',
    event=>{

      if(
        !drag ||
        event.pointerId !== drag.id ||
        flipping
      ){
        return;
      }

      const now =
        performance.now();

      const dx =
        event.clientX -
        drag.startX;

      const dy =
        event.clientY -
        drag.startY;

      /*
        Coin gives slightly under your
        finger instead of instantly
        launching.
      */

      const previewX =
        clampNum(
          dx*.18,
          -42,
          42
        );

      const previewY =
        clampNum(
          dy*.18,
          -42,
          42
        );

      const twist =
        clampNum(
          dx*.055,
          -13,
          13
        );

      coinWrap.style.transform =
        `translate3d(${previewX}px,${previewY}px,0) rotateZ(${twist}deg)`;

      shadow.style.transform =
        `translate(calc(-50% + ${previewX*.7}px),${previewY*.32}px) scale(${1-Math.min(.16,Math.hypot(previewX,previewY)/300)})`;

      drag.lastX =
        event.clientX;

      drag.lastY =
        event.clientY;

      drag.lastT =
        now;

      drag.samples.push({

        x:event.clientX,
        y:event.clientY,
        t:now

      });

      /*
        Keep recent movement for
        actual release velocity.
      */

      while(
        drag.samples.length > 2 &&
        now-drag.samples[0].t > 90
      ){

        drag.samples.shift();

      }

    }
  );

  function finishGesture(
    event,
    cancelled=false
  ){

    if(
      !drag ||
      event.pointerId !== drag.id
    ){
      return;
    }

    const gesture =
      drag;

    drag = null;

    coinWrap.classList.remove(
      'dragging'
    );

    if(
      cancelled ||
      flipping
    ){

      coinWrap.style.transform='';

      shadow.style.transform='';

      return;

    }

    const now =
      performance.now();

    const dx =
      event.clientX -
      gesture.startX;

    const dy =
      event.clientY -
      gesture.startY;

    const distance =
      Math.hypot(
        dx,
        dy
      );

    const oldest =
      gesture.samples[0] || {

        x:gesture.startX,
        y:gesture.startY,
        t:gesture.startT

      };

    const elapsed =
      Math.max(
        16,
        now-oldest.t
      );

    const vx =
      (
        event.clientX -
        oldest.x
      ) / elapsed;

    const vy =
      (
        event.clientY -
        oldest.y
      ) / elapsed;

    const speed =
      Math.hypot(
        vx,
        vy
      );

    /*
      Where you hit the coin affects
      visual torque/spin direction.
    */

    const tapX =
      clampNum(
        (
          gesture.startX -
          gesture.cx
        ) /
        gesture.radius,
        -1,
        1
      );

    const tapY =
      clampNum(
        (
          gesture.startY -
          gesture.cy
        ) /
        gesture.radius,
        -1,
        1
      );

    const edge =
      clampNum(
        Math.hypot(
          tapX,
          tapY
        ),
        0,
        1
      );

    const spinBias =
      clampNum(
        tapX +
        (-tapY*.18),
        -1,
        1
      );

    coinWrap.style.transform='';

    shadow.style.transform='';

    /*
      ANY direction works:
      vertical, horizontal,
      downward or diagonal.
    */

    if(
      distance >= 13 ||
      speed >= .16
    ){

      const strength =
        clampNum(
          .68 +
          speed*.92 +
          Math.min(
            distance,
            240
          )/300,
          .68,
          2.25
        );

      doFlip({

        vx,
        vy,
        strength,
        spinBias

      });

      return;

    }

    /*
      Tap fallback.
      Edge taps create more torque.
    */

    doFlip({

      vx:
        tapX *
        secureFloat(
          .18,
          .48
        ),

      vy:
        -secureFloat(
          .62,
          1.02
        ) +
        tapY*.12,

      strength:
        .78 +
        edge*.22,

      spinBias

    });

  }

  stage.addEventListener(
    'pointerup',
    event =>
      finishGesture(
        event,
        false
      )
  );

  stage.addEventListener(
    'pointercancel',
    event =>
      finishGesture(
        event,
        true
      )
  );

  flipBtn.addEventListener(
    'click',
    ()=>{

      const angle =
        secureFloat(
          0,
          Math.PI*2
        );

      doFlip({

        vx:
          Math.cos(angle) *
          secureFloat(
            .45,
            1.05
          ),

        vy:
          Math.sin(angle) *
          secureFloat(
            .45,
            1.05
          ),

        strength:
          secureFloat(
            .85,
            1.20
          ),

        spinBias:
          secureFloat(
            -.4,
            .4
          )

      });

    }
  );

  singleBtn.addEventListener(
    'click',
    ()=>setMode('single')
  );

  bo3Btn.addEventListener(
    'click',
    ()=>setMode('bo3')
  );

  soundBtn.addEventListener(
    'click',
    ()=>{

      soundOn =
        !soundOn;

      soundBtn.textContent =
        soundOn
          ? 'Sound On'
          : 'Sound Off';

      if(soundOn){

        ensureAudio();

        tone(
          520,
          .06,
          .035
        );

      }

    }
  );

  let motionSamples = 0;

  let lastMagnitude = 9.81;

  let sensorCheckTimer = null;

  function triggerShake(
    strength=1
  ){

    if(flipping) return;

    const now =
      performance.now();

    if(
      now-lastShake < 850
    ){
      return;
    }

    lastShake = now;

    doFlip({

      vx:
        secureFloat(
          -.55,
          .55
        ),

      vy:
        -1.3,

      strength:
        Math.min(
          1.9,
          Math.max(
            .9,
            strength
          )
        )

    });

  }

  function evaluateAcceleration(
    x,
    y,
    z
  ){

    const magnitude =
      Math.sqrt(
        x*x +
        y*y +
        z*z
      );

    const jerk =
      Math.abs(
        magnitude -
        lastMagnitude
      );

    const gravityDelta =
      Math.abs(
        magnitude -
        9.81
      );

    lastMagnitude =
      magnitude;

    motionSamples++;

    if(
      motionSamples === 1
    ){

      motionEnabled = true;

      motionBtn.textContent =
        'Shake On';

      statusEl.textContent =
        'Shake ready · sensor data received';

      if(sensorCheckTimer){

        clearTimeout(
          sensorCheckTimer
        );

      }

    }

    if(
      jerk > 5.8 ||
      gravityDelta > 7.2
    ){

      triggerShake(
        Math.max(
          .9,
          Math.min(
            1.9,
            Math.max(
              jerk,
              gravityDelta
            ) / 7
          )
        )
      );

    }

  }

  function handleMotion(
    event
  ){

    const acceleration =
      event.accelerationIncludingGravity ||
      event.acceleration;

    if(
      !acceleration ||
      acceleration.x == null ||
      acceleration.y == null ||
      acceleration.z == null
    ){
      return;
    }

    evaluateAcceleration(

      Number(
        acceleration.x
      ),

      Number(
        acceleration.y
      ),

      Number(
        acceleration.z
      )

    );

  }

  async function tryGenericAccelerometer(){

    if(
      !('Accelerometer' in window)
    ){
      return false;
    }

    try{

      if(
        navigator.permissions &&
        navigator.permissions.query
      ){

        try{

          const permission =
            await navigator.permissions.query({
              name:'accelerometer'
            });

          if(
            permission.state ===
            'denied'
          ){
            return false;
          }

        }catch(_){}

      }

      const sensor =
        new Accelerometer({
          frequency:40
        });

      sensor.addEventListener(
        'reading',
        ()=>{

          evaluateAcceleration(

            Number(
              sensor.x || 0
            ),

            Number(
              sensor.y || 0
            ),

            Number(
              sensor.z || 0
            )

          );

        }
      );

      sensor.addEventListener(
        'error',
        ()=>{}
      );

      sensor.start();

      window.__coinAccelerometer =
        sensor;

      return true;

    }catch(_){

      return false;

    }

  }

  function motionPolicyAllows(){

    try{

      const policy =
        document.permissionsPolicy ||
        document.featurePolicy;

      if(
        policy &&
        typeof policy.allowsFeature ===
        'function'
      ){

        return policy.allowsFeature(
          'accelerometer'
        );

      }

    }catch(_){}

    return true;

  }

  async function enableMotion(){

    motionSamples = 0;

    motionEnabled = false;

    motionBtn.textContent =
      'Testing…';

    if(
      !window.isSecureContext
    ){

      motionBtn.textContent =
        'Shake Needs HTTPS';

      statusEl.textContent =
        'Android Chrome will not expose motion sensors here. Open the app from an HTTPS website.';

      return;

    }

    if(
      window.top !== window.self &&
      !motionPolicyAllows()
    ){

      motionBtn.textContent =
        'Shake Blocked';

      statusEl.textContent =
        'This preview blocks the accelerometer. Open the page directly in Chrome.';

      return;

    }

    statusEl.textContent =
      'Waiting for Android motion data… move the phone now.';

    let listenerAttached =
      false;

    try{

      if(
        'DeviceMotionEvent' in window
      ){

        if(
          typeof DeviceMotionEvent.requestPermission ===
          'function'
        ){

          const permission =
            await DeviceMotionEvent.requestPermission();

          if(
            permission ===
            'granted'
          ){

            window.addEventListener(
              'devicemotion',
              handleMotion,
              {passive:true}
            );

            listenerAttached =
              true;

          }

        }else{

          window.addEventListener(
            'devicemotion',
            handleMotion,
            {passive:true}
          );

          listenerAttached =
            true;

        }

      }

    }catch(_){}

    const genericStarted =
      await tryGenericAccelerometer();

    sensorCheckTimer =
      setTimeout(
        ()=>{

          if(
            motionSamples === 0
          ){

            motionEnabled = false;

            motionBtn.textContent =
              'Shake Blocked';

            if(
              window.top !==
              window.self
            ){

              statusEl.textContent =
                'No sensor data reached this embedded preview. Open it directly in Chrome.';

            }else if(
              !motionPolicyAllows()
            ){

              statusEl.textContent =
                'The page policy blocks accelerometer access.';

            }else{

              statusEl.textContent =
                'No motion data. In Chrome: Site settings → Motion sensors → Allow, then reload.';

            }

          }

        },
        2200
      );

    if(
      !listenerAttached &&
      !genericStarted
    ){

      /*
        Timer above will produce the
        useful error message.
      */

    }

  }

  motionBtn.addEventListener(
    'click',
    ()=>{

      if(!motionEnabled){

        enableMotion();

      }

    }
  );

  document
    .querySelectorAll(
      '.quarter-photo'
    )
    .forEach(
      image=>{

        image.addEventListener(
          'error',
          ()=>{

            statusEl.textContent =
              'Quarter photo could not load. This version needs internet once for the real coin images.';

          }
        );

      }
    );

  stage.addEventListener(
    'touchmove',
    event =>
      event.preventDefault(),
    {passive:false}
  );

})();
</script>

</body>
</html>
