<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Coin Flip</title>
<link rel="preload" as="image" href="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg">
<link rel="preload" as="image" href="https://upload.wikimedia.org/wikipedia/commons/e/eb/United_States_Quarter_Reverse_2021.jpg">
<style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#171a20;--panel2:#1d2129;--text:#f5f7fb;--muted:#9ba3b0;--line:#2b313d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior:none;touch-action:manipulation}

.app{
  height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:12px;
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);
  background:
    radial-gradient(circle at 50% 38%,rgba(255,255,255,.055),transparent 32%),
    linear-gradient(180deg,#101319,#0c0e12);
}

.topbar{
  display:flex;
  justify-content:center;
  align-items:center;
}

.mode{
  display:flex;
  gap:4px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
}

.mode button{
  border:0;
  padding:9px 12px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-weight:750;
}

.mode button.active{
  color:var(--text);
  background:var(--panel2);
  box-shadow:0 3px 12px rgba(0,0,0,.22);
}

.stage{
  position:relative;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  perspective:1200px;
  touch-action:none;
  user-select:none;
}

.hint{
  position:absolute;
  top:4%;
  left:50%;
  transform:translateX(-50%);
  width:min(92%,460px);
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.4;
  pointer-events:none;
  transition:opacity .2s;
}

.score{
  position:absolute;
  top:13%;
  left:50%;
  transform:translateX(-50%);
  opacity:0;
  color:var(--muted);
  font-size:14px;
  font-weight:750;
  pointer-events:none;
  transition:opacity .2s;
}

.score.show{opacity:1}

.coin-wrap{
  position:relative;
  width:210px;
  height:210px;
  transform-style:preserve-3d;
  will-change:transform;
  cursor:grab;
}

.coin-wrap.dragging{cursor:grabbing}

.coin{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  transform-style:preserve-3d;
  will-change:transform;
}

.face,
.edge{
  position:absolute;
  inset:0;
  border-radius:50%;
  backface-visibility:hidden;
}

.face{
  overflow:hidden;
  border:3px solid #adb2ba;
  background:#c8ccd2;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.5),
    inset 0 0 14px rgba(0,0,0,.18),
    0 18px 34px rgba(0,0,0,.42);
}

.heads{transform:translateZ(8px)}
.tails{transform:rotateY(180deg) translateZ(8px)}

.quarter-photo{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  transform:scale(1.015);
  filter:contrast(1.05) brightness(.98);
  pointer-events:none;
  user-select:none;
}

.edge{
  transform:translateZ(0);
  border:8px solid #8e949d;
  background:
    repeating-linear-gradient(
      90deg,
      #666c74 0 1px,
      #d8dbe0 1px 2px,
      #838992 2px 3px,
      #c3c7cd 3px 4px
    );
  box-shadow:inset 0 0 8px rgba(0,0,0,.32);
}

.shadow{
  position:absolute;
  left:50%;
  top:calc(50% + 135px);
  width:132px;
  height:26px;
  transform:translateX(-50%);
  border-radius:50%;
  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.46),
      rgba(0,0,0,.13) 45%,
      transparent 72%
    );
  filter:blur(4px);
  opacity:.64;
  pointer-events:none;
  will-change:transform,opacity;
}

.result{
  position:absolute;
  left:50%;
  bottom:7%;
  transform:translateX(-50%) translateY(8px);
  opacity:0;
  text-align:center;
  font-size:28px;
  font-weight:850;
  letter-spacing:.5px;
  pointer-events:none;
  transition:opacity .22s,transform .22s;
}

.result.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.result small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
}

.pill{
  min-width:0;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  color:var(--text);
  font-size:14px;
  font-weight:800;
}

.pill.secondary{color:var(--muted)}
.pill:active{transform:scale(.97)}

.status{
  min-height:17px;
  margin-top:6px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

@media(max-height:650px){
  .coin-wrap{
    width:165px;
    height:165px;
  }

  .shadow{
    top:calc(50% + 107px);
  }

  .result{
    bottom:2%;
  }

  .hint{
    top:1%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="mode">
      <button id="singleBtn" class="active">Single</button>
      <button id="bo3Btn">Best of 3</button>
    </div>
  </header>

  <main class="stage" id="stage">

    <div class="hint" id="hint">
      Flick it any direction, tap it, or shake your phone
    </div>

    <div class="score" id="score">
      Heads 0 · Tails 0
    </div>

    <div class="shadow" id="shadow"></div>

    <div class="coin-wrap" id="coinWrap">
      <div class="coin" id="coin">

        <div class="face heads">
          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg"
            alt="Heads"
            draggable="false"
          >
        </div>

        <div class="face tails">
          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/e/eb/United_States_Quarter_Reverse_2021.jpg"
            alt="Tails"
            draggable="false"
          >
        </div>

        <div class="edge"></div>

      </div>
    </div>

    <div class="result" id="result"></div>

  </main>

  <footer>

    <div class="controls">

      <button
        class="pill secondary"
        id="motionBtn"
      >
        Enable Shake
      </button>

      <button
        class="pill"
        id="flipBtn"
      >
        Flip
      </button>

      <button
        class="pill secondary"
        id="soundBtn"
      >
        Sound On
      </button>

    </div>

    <div
      class="status"
      id="status"
    >
      Secure 50/50 randomness
    </div>

  </footer>

</div>

<script>
(() => {

'use strict';


const $ =
  id =>
    document.getElementById(id);


const stage =
  $('stage');

const coinWrap =
  $('coinWrap');

const coin =
  $('coin');

const shadow =
  $('shadow');

const resultEl =
  $('result');

const scoreEl =
  $('score');

const hint =
  $('hint');

const singleBtn =
  $('singleBtn');

const bo3Btn =
  $('bo3Btn');

const motionBtn =
  $('motionBtn');

const flipBtn =
  $('flipBtn');

const soundBtn =
  $('soundBtn');

const statusEl =
  $('status');


let mode =
  'single';

let flipping =
  false;

let soundOn =
  true;

let currentFace =
  'heads';


let coinPos = {
  x:0,
  y:0
};


let series = {
  heads:0,
  tails:0
};


/* ---------- Random ---------- */

function secureBit(){

  const a =
    new Uint32Array(1);

  crypto.getRandomValues(a);

  return (
    (a[0] & 1) === 0
      ? 'heads'
      : 'tails'
  );

}


function secureFloat(
  min,
  max
){

  const a =
    new Uint32Array(1);

  crypto.getRandomValues(a);

  return (
    min +
    (
      a[0] /
      4294967295
    ) *
    (
      max -
      min
    )
  );

}


const clamp =
  (
    value,
    min,
    max
  ) =>
    Math.max(
      min,
      Math.min(
        max,
        value
      )
    );


const wait =
  ms =>
    new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );


/* ---------- Audio ---------- */

const COIN_IMPACT_URL =
  'https://upload.wikimedia.org/wikipedia/commons/c/c5/Coin_dropped_on_wooden_floor.ogg';


let audioCtx =
  null;

let impactBuffer =
  null;

let impactStart =
  0;

let decodePromise =
  null;


/*
  Start downloading before
  the first flip.
*/

let audioBytesPromise =

  fetch(
    COIN_IMPACT_URL,
    {
      mode:'cors',
      cache:'force-cache'
    }
  )

  .then(
    response => {

      if(
        !response.ok
      ){

        throw new Error(
          `Audio HTTP ${response.status}`
        );

      }

      return response
        .arrayBuffer();

    }
  )

  .catch(
    error => {

      console.warn(
        'Coin audio download failed:',
        error
      );

      return null;

    }
  );


function ensureAudio(){

  if(
    !audioCtx
  ){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioCtx.state ===
    'suspended'
  ){

    audioCtx
      .resume()
      .catch(
        () => {}
      );

  }


  return audioCtx;

}


/*
  Find the first real sound in
  the coin recording so silence
  at the beginning isn't played.
*/

function findImpactStart(
  buffer
){

  try{

    const threshold =
      .018;


    for(
      let i=0;
      i<buffer.length;
      i+=16
    ){

      let peak =
        0;


      for(
        let channel=0;
        channel<buffer.numberOfChannels;
        channel++
      ){

        peak =
          Math.max(
            peak,
            Math.abs(
              buffer
                .getChannelData(
                  channel
                )[i]
            )
          );

      }


      if(
        peak >
        threshold
      ){

        return Math.max(
          0,
          i /
          buffer.sampleRate -
          .012
        );

      }

    }

  }
  catch(_){}


  return 0;

}


function decodeImpact(){

  if(
    impactBuffer
  ){

    return Promise.resolve(
      impactBuffer
    );

  }


  if(
    decodePromise
  ){

    return decodePromise;

  }


  const ctx =
    ensureAudio();


  decodePromise =

    audioBytesPromise

    .then(
      bytes =>
        bytes
          ? ctx.decodeAudioData(
              bytes.slice(0)
            )
          : null
    )

    .then(
      buffer => {

        impactBuffer =
          buffer ||
          null;


        if(
          impactBuffer
        ){

          impactStart =
            findImpactStart(
              impactBuffer
            );

        }


        return impactBuffer;

      }
    )

    .catch(
      error => {

        console.warn(
          'Coin audio decode failed:',
          error
        );

        return null;

      }
    );


  return decodePromise;

}


/*
  Unlock Web Audio during a real
  touch/click so Android allows
  later landing sounds.
*/

function warmAudio(){

  try{

    const ctx =
      ensureAudio();


    const silent =
      ctx.createBuffer(
        1,
        1,
        22050
      );


    const source =
      ctx.createBufferSource();


    source.buffer =
      silent;


    source.connect(
      ctx.destination
    );


    source.start();


    decodeImpact();

  }
  catch(error){

    console.warn(
      'Audio warm-up failed:',
      error
    );

  }

}


/*
  Immediate launch sound.
*/

function playLaunchSound(
  strength=1
){

  if(
    !soundOn
  ){

    return;

  }


  try{

    const ctx =
      ensureAudio();


    const now =
      ctx.currentTime;


    const length =
      Math.max(
        1,
        Math.floor(
          ctx.sampleRate *
          .025
        )
      );


    const buffer =
      ctx.createBuffer(
        1,
        length,
        ctx.sampleRate
      );


    const data =
      buffer.getChannelData(0);


    for(
      let i=0;
      i<length;
      i++
    ){

      data[i] =
        secureFloat(
          -1,
          1
        ) *
        Math.pow(
          1 -
          i/length,
          3.5
        );

    }


    const noise =
      ctx.createBufferSource();


    const highpass =
      ctx.createBiquadFilter();


    const noiseGain =
      ctx.createGain();


    noise.buffer =
      buffer;


    highpass.type =
      'highpass';


    highpass.frequency.value =
      1900;


    noiseGain.gain
      .setValueAtTime(
        clamp(
          .018 +
          strength*.011,
          .02,
          .05
        ),
        now
      );


    noiseGain.gain
      .exponentialRampToValueAtTime(
        .0001,
        now+.03
      );


    noise
      .connect(
        highpass
      )
      .connect(
        noiseGain
      )
      .connect(
        ctx.destination
      );


    noise.start(
      now
    );


    const oscillator =
      ctx.createOscillator();


    const ringGain =
      ctx.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      secureFloat(
        1300,
        1650
      );


    ringGain.gain
      .setValueAtTime(
        clamp(
          .012 +
          strength*.006,
          .014,
          .03
        ),
        now
      );


    ringGain.gain
      .exponentialRampToValueAtTime(
        .0001,
        now+.05
      );


    oscillator
      .connect(
        ringGain
      )
      .connect(
        ctx.destination
      );


    oscillator.start(
      now
    );


    oscillator.stop(
      now+.06
    );

  }
  catch(_){}

}


/*
  Backup impact if the downloaded
  recording isn't ready.
*/

function fallbackImpact(
  intensity=1
){

  if(
    !soundOn
  ){

    return;

  }


  try{

    const ctx =
      ensureAudio();


    const now =
      ctx.currentTime;


    [
      900,
      1750,
      3100,
      5100
    ]

    .forEach(
      (
        frequency,
        index
      ) => {

        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        oscillator.type =
          'sine';


        oscillator.frequency.value =
          frequency *
          secureFloat(
            .97,
            1.03
          );


        gain.gain
          .setValueAtTime(
            (
              .03 /
              (
                index +
                1
              )
            ) *
            intensity,
            now +
            index*.002
          );


        gain.gain
          .exponentialRampToValueAtTime(
            .0001,
            now +
            .05 +
            index*.02
          );


        oscillator
          .connect(
            gain
          )
          .connect(
            ctx.destination
          );


        oscillator.start(
          now +
          index*.002
        );


        oscillator.stop(
          now +
          .1 +
          index*.02
        );

      }
    );

  }
  catch(_){}

}


function playImpact(
  intensity=1
){

  if(
    !soundOn
  ){

    return;

  }


  if(
    !impactBuffer ||
    !audioCtx
  ){

    decodeImpact();

    fallbackImpact(
      intensity
    );

    return;

  }


  try{

    const source =
      audioCtx
        .createBufferSource();


    const gain =
      audioCtx
        .createGain();


    const highpass =
      audioCtx
        .createBiquadFilter();


    source.buffer =
      impactBuffer;


    source.playbackRate.value =
      secureFloat(
        .97,
        1.04
      );


    gain.gain.value =
      clamp(
        .28 +
        intensity*.20,
        0,
        .56
      );


    highpass.type =
      'highpass';


    highpass.frequency.value =
      110;


    source
      .connect(
        highpass
      )
      .connect(
        gain
      )
      .connect(
        audioCtx.destination
      );


    source.start(
      0,
      impactStart
    );

  }
  catch(error){

    console.warn(
      'Impact playback failed:',
      error
    );


    fallbackImpact(
      intensity
    );

  }

}


function vibrate(
  pattern
){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      pattern
    );

  }

}


/* ---------- UI ---------- */

function clearResult(){

  resultEl
    .classList
    .remove(
      'show'
    );

}


function showResult(
  text,
  sub=''
){

  resultEl.innerHTML =
    `${text.toUpperCase()}${
      sub
        ? `<small>${sub}</small>`
        : ''
    }`;


  resultEl
    .classList
    .add(
      'show'
    );

}


function updateScore(){

  scoreEl.textContent =
    `Heads ${series.heads} · Tails ${series.tails}`;

}


function setMode(
  next
){

  if(
    flipping
  ){

    return;

  }


  mode =
    next;


  singleBtn
    .classList
    .toggle(
      'active',
      mode ===
      'single'
    );


  bo3Btn
    .classList
    .toggle(
      'active',
      mode ===
      'bo3'
    );


  scoreEl
    .classList
    .toggle(
      'show',
      mode ===
      'bo3'
    );


  series = {
    heads:0,
    tails:0
  };


  updateScore();

  clearResult();

}


/* ---------- Position ---------- */

function stageLimits(){

  const stageRect =
    stage.getBoundingClientRect();


  const coinRect =
    coinWrap.getBoundingClientRect();


  const radius =
    Math.min(
      coinRect.width,
      coinRect.height
    ) / 2;


  return {

    x:
      Math.max(
        20,
        stageRect.width/2 -
        radius -
        18
      ),

    y:
      Math.max(
        20,
        stageRect.height/2 -
        radius -
        48
      )

  };

}


function setRest(){

  coinWrap.style.transform =
    `translate3d(
      ${coinPos.x}px,
      ${coinPos.y}px,
      0
    )`;


  coin.style.transform =
    `rotateY(${
      currentFace ===
      'tails'
        ? 180
        : 0
    }deg)
    scale(1)`;


  shadow.style.transform =
    `translate(
      calc(
        -50% +
        ${coinPos.x}px
      ),
      ${coinPos.y}px
    )
    scale(1)`;


  shadow.style.opacity =
    '.64';

}


function cancelAnimations(){

  [
    coinWrap,
    coin,
    shadow
  ]

  .forEach(
    element =>
      element
        .getAnimations()
        .forEach(
          animation =>
            animation.cancel()
        )
  );

}


function clampToStage(){

  const limits =
    stageLimits();


  coinPos.x =
    clamp(
      coinPos.x,
      -limits.x,
      limits.x
    );


  coinPos.y =
    clamp(
      coinPos.y,
      -limits.y,
      limits.y
    );


  cancelAnimations();

  setRest();

}


function recover(
  error
){

  console.error(
    error
  );


  flipping =
    false;


  hint.style.opacity =
    '1';


  coinWrap
    .classList
    .remove(
      'dragging'
    );


  try{

    clampToStage();

  }
  catch(_){}


  statusEl.textContent =
    'Recovered from an animation error · try again';

}


/* ---------- Flip ---------- */

async function doFlip(
  gesture={}
){

  if(
    flipping
  ){

    return;

  }


  flipping =
    true;


  clearResult();


  hint.style.opacity =
    '.15';


  try{

    warmAudio();

    cancelAnimations();

    clampToStage();

    setRest();


    /*
      Result is chosen independently
      before physics.
    */

    const outcome =
      secureBit();


    let vx =
      Number(
        gesture.vx ||
        0
      );


    let vy =
      Number(
        gesture.vy ||
        0
      );


    if(
      Math.abs(vx) < .01 &&
      Math.abs(vy) < .01
    ){

      const angle =
        secureFloat(
          0,
          Math.PI*2
        );


      vx =
        Math.cos(
          angle
        );


      vy =
        Math.sin(
          angle
        );

    }


    const velocity =
      Math.hypot(
        vx,
        vy
      );


    const dirX =
      vx /
      Math.max(
        velocity,
        .001
      );


    const dirY =
      vy /
      Math.max(
        velocity,
        .001
      );


    const strength =
      clamp(
        Number(
          gesture.strength ||
          1
        ),
        .65,
        2.4
      );


    /*
      Immediate release sound.
    */

    playLaunchSound(
      strength
    );


    const limits =
      stageLimits();


    const up =
      clamp(
        -dirY,
        0,
        1
      );


    const down =
      clamp(
        dirY,
        0,
        1
      );


    const side =
      Math.abs(
        dirX
      );


    let travelX =
      dirX *
      (
        65 +
        strength*95
      );


    let travelY =
      dirY *
      (
        35 +
        strength*48
      );


    if(
      side>.72 &&
      Math.abs(dirY)<.55
    ){

      travelX =
        dirX *
        (
          105 +
          strength*115
        );


      travelY =
        dirY *
        (
          22 +
          strength*25
        );

    }


    if(
      down>.58
    ){

      travelY =
        dirY *
        (
          70 +
          strength*75
        );

    }


    if(
      up>.58
    ){

      travelY =
        dirY *
        (
          75 +
          strength*90
        );

    }


    const startX =
      coinPos.x;


    const startY =
      coinPos.y;


    const edgeRatioX =
      Math.abs(
        startX
      ) /
      Math.max(
        1,
        limits.x
      );


    const edgeRatioY =
      Math.abs(
        startY
      ) /
      Math.max(
        1,
        limits.y
      );


    if(
      edgeRatioX>.72
    ){

      travelX +=
        -Math.sign(
          startX
        ) *
        (
          edgeRatioX -
          .72
        ) *
        70;

    }


    if(
      edgeRatioY>.72
    ){

      travelY +=
        -Math.sign(
          startY
        ) *
        (
          edgeRatioY -
          .72
        ) *
        55;

    }


    const rawX =
      startX +
      travelX;


    const rawY =
      startY +
      travelY;


    const hitX =
      rawX <
      -limits.x ||
      rawX >
      limits.x;


    const hitY =
      rawY <
      -limits.y ||
      rawY >
      limits.y;


    const hitEdge =
      hitX ||
      hitY;


    const targetX =
      clamp(
        rawX,
        -limits.x,
        limits.x
      );


    const targetY =
      clamp(
        rawY,
        -limits.y,
        limits.y
      );


    const contactBias =
      clamp(
        Number(
          gesture.spinBias ||
          0
        ),
        -1,
        1
      );


    let spinDir =
      Math.sign(
        vx*.8 +
        contactBias
      );


    if(
      !spinDir
    ){

      spinDir =
        secureFloat(
          0,
          1
        ) < .5
          ? -1
          : 1;

    }


    const startRot =
      currentFace ===
      'tails'
        ? 180
        : 0;


    const turns =
      Math.round(
        secureFloat(
          4,
          7
        ) +
        strength*1.7
      );


    const endRot =
      startRot +
      spinDir *
      (
        turns*360 +
        (
          outcome ===
          currentFace
            ? 0
            : 180
        )
      );


    const duration =
      clamp(
        960 +
        strength*250 +
        secureFloat(
          -90,
          120
        ),
        980,
        1660
      );


    let points;


    /*
      Downward throw.
    */

    if(
      down>.58
    ){

      const diveX =
        startX +
        (
          targetX -
          startX
        )*.66;


      const diveY =
        clamp(
          startY +
          (
            75 +
            strength*80
          ),
          -limits.y,
          limits.y
        );


      const reboundY =
        clamp(
          targetY -
          (
            28 +
            strength*25
          ),
          -limits.y,
          limits.y
        );


      points = [

        {
          x:startX,
          y:startY,
          o:0,
          s:1,
          a:.64,
          c:1
        },

        {
          x:diveX,
          y:diveY,
          o:.38,
          s:.78,
          a:.42,
          c:1.035
        },

        {
          x:targetX,
          y:reboundY,
          o:.68,
          s:.84,
          a:.48,
          c:1.025
        },

        {
          x:targetX,
          y:targetY,
          o:1,
          s:1,
          a:.64,
          c:1
        }

      ];

    }


    /*
      Sideways throw.
    */

    else if(
      side>.72 &&
      Math.abs(dirY)<.55
    ){

      const hop =
        38 +
        strength*28;


      const midX =
        startX +
        (
          targetX -
          startX
        )*.53;


      const midY =
        clamp(
          startY -
          hop,
          -limits.y,
          limits.y
        );


      points = [

        {
          x:startX,
          y:startY,
          o:0,
          s:1,
          a:.64,
          c:1
        },

        {
          x:midX,
          y:midY,
          o:.47,
          s:.72,
          a:.36,
          c:1.045
        },

        {
          x:targetX,
          y:targetY,
          o:1,
          s:1,
          a:.64,
          c:1
        }

      ];

    }


    /*
      Upward throw.
    */

    else if(
      up>.58
    ){

      const rise =
        125 +
        strength*85;


      const apexX =
        startX +
        (
          targetX -
          startX
        )*.42;


      const apexY =
        clamp(
          startY -
          rise,
          -limits.y,
          limits.y
        );


      points = [

        {
          x:startX,
          y:startY,
          o:0,
          s:1,
          a:.64,
          c:1
        },

        {
          x:apexX,
          y:apexY,
          o:.46,
          s:.48,
          a:.18,
          c:1.07
        },

        {
          x:targetX,
          y:targetY,
          o:1,
          s:1,
          a:.64,
          c:1
        }

      ];

    }


    /*
      Diagonal.
    */

    else{

      const perpendicularX =
        -dirY;


      const perpendicularY =
        dirX;


      const arc =
        secureFloat(
          22,
          46
        ) *
        (
          .8 +
          strength*.25
        );


      const midX =
        startX +
        (
          targetX -
          startX
        )*.52 +
        perpendicularX*arc;


      const midY =
        startY +
        (
          targetY -
          startY
        )*.52 +
        perpendicularY*arc;


      points = [

        {
          x:startX,
          y:startY,
          o:0,
          s:1,
          a:.64,
          c:1
        },

        {
          x:midX,
          y:midY,
          o:.5,
          s:.66,
          a:.32,
          c:1.05
        },

        {
          x:targetX,
          y:targetY,
          o:1,
          s:1,
          a:.64,
          c:1
        }

      ];

    }


    const travelFrames =
      points.map(
        point => ({

          transform:
            `translate3d(
              ${point.x}px,
              ${point.y}px,
              0
            )`,

          offset:
            point.o

        })
      );


    const shadowFrames =
      points.map(
        point => ({

          transform:
            `translate(
              calc(
                -50% +
                ${point.x}px
              ),
              ${point.y}px
            )
            scale(
              ${point.s}
            )`,

          opacity:
            point.a,

          offset:
            point.o

        })
      );


    /*
      Save the actual movement
      animation so we can wait for
      its real contact point.
    */

    const travelAnimation =
      coinWrap.animate(
        travelFrames,
        {

          duration,

          easing:
            'cubic-bezier(.16,.68,.22,1)',

          fill:
            'forwards'

        }
      );


    shadow.animate(
      shadowFrames,
      {

        duration,

        easing:
          'cubic-bezier(.16,.68,.22,1)',

        fill:
          'forwards'

      }
    );


    const wobbleX =
      secureFloat(
        -48,
        48
      );


    const wobbleZ =
      clamp(
        dirX*36 +
        contactBias*18 +
        secureFloat(
          -8,
          8
        ),
        -55,
        55
      );


    const midScale =
      Math.max(
        ...points.map(
          point =>
            point.c ||
            1
        )
      );


    coin.animate(
      [

        {
          transform:
            `rotateY(${startRot}deg)
            rotateX(0deg)
            rotateZ(0deg)
            scale(1)`,

          offset:0
        },

        {
          transform:
            `rotateY(${
              startRot +
              (
                endRot -
                startRot
              )*.48
            }deg)
            rotateX(${wobbleX}deg)
            rotateZ(${wobbleZ}deg)
            scale(${midScale})`,

          offset:.48
        },

        {
          transform:
            `rotateY(${
              startRot +
              (
                endRot -
                startRot
              )*.90
            }deg)
            rotateX(${wobbleX*.16}deg)
            rotateZ(${wobbleZ*.12}deg)
            scale(1.015)`,

          offset:.89
        },

        {
          transform:
            `rotateY(${endRot}deg)
            rotateX(0deg)
            rotateZ(0deg)
            scale(1)`,

          offset:1
        }

      ],
      {

        duration,

        easing:
          'cubic-bezier(.12,.54,.20,1)',

        fill:
          'forwards'

      }
    );


    /*
      EXACT LANDING CONTACT.

      No guessed .82 or .87 timing.
      When the actual flight reaches
      targetX/targetY, play the hit.
    */

    await travelAnimation.finished;


    playImpact(
      clamp(
        .82 +
        strength*.18,
        .85,
        1.25
      )
    );


    vibrate(
      [
        20,
        26,
        10
      ]
    );


    /*
      Bounce starts immediately
      after contact.
    */

    let finalX =
      targetX;


    let finalY =
      targetY;


    if(
      hitEdge
    ){

      const inwardX =
        hitX

          ? -Math.sign(
              rawX
            ) *
            (
              24 +
              strength*13
            )

          : dirX *
            (
              5 +
              strength*2
            );


      const inwardY =
        hitY

          ? -Math.sign(
              rawY
            ) *
            (
              20 +
              strength*11
            )

          : -(
              7 +
              strength*3
            );


      finalX =
        clamp(
          targetX +
          inwardX,
          -limits.x,
          limits.x
        );


      finalY =
        clamp(
          targetY +
          inwardY,
          -limits.y,
          limits.y
        );


      const move =
        coinWrap.animate(
          [

            {
              transform:
                `translate3d(
                  ${targetX}px,
                  ${targetY}px,
                  0
                )`
            },

            {
              transform:
                `translate3d(
                  ${finalX}px,
                  ${finalY}px,
                  0
                )`
            }

          ],
          {

            duration:210,

            easing:
              'cubic-bezier(.18,.76,.28,1)',

            fill:
              'forwards'

          }
        );


      shadow.animate(
        [

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${targetX}px
                ),
                ${targetY}px
              )
              scale(.92)`,

            opacity:.58
          },

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${finalX}px
                ),
                ${finalY}px
              )
              scale(1)`,

            opacity:.64
          }

        ],
        {

          duration:210,

          easing:
            'cubic-bezier(.18,.76,.28,1)',

          fill:
            'forwards'

        }
      );


      await move.finished;


      vibrate(
        7
      );

    }


    else{

      const bounceX =
        clamp(
          targetX +
          dirX *
          (
            5 +
            strength*3
          ),
          -limits.x,
          limits.x
        );


      const bounceY =
        clamp(
          targetY -
          (
            8 +
            strength*5
          ),
          -limits.y,
          limits.y
        );


      const bounce =
        coinWrap.animate(
          [

            {
              transform:
                `translate3d(
                  ${targetX}px,
                  ${targetY}px,
                  0
                )`
            },

            {
              transform:
                `translate3d(
                  ${bounceX}px,
                  ${bounceY}px,
                  0
                )`,

              offset:.35
            },

            {
              transform:
                `translate3d(
                  ${targetX}px,
                  ${targetY}px,
                  0
                )`
            }

          ],
          {

            duration:220,

            easing:
              'ease-out',

            fill:
              'forwards'

          }
        );


      shadow.animate(
        [

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${targetX}px
                ),
                ${targetY}px
              )
              scale(1)`,

            opacity:.64
          },

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${bounceX}px
                ),
                ${bounceY}px
              )
              scale(.92)`,

            opacity:.56,

            offset:.35
          },

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${targetX}px
                ),
                ${targetY}px
              )
              scale(1)`,

            opacity:.64
          }

        ],
        {

          duration:220,

          easing:
            'ease-out',

          fill:
            'forwards'

        }
      );


      if(
        strength >
        1.25
      ){

        setTimeout(
          () =>
            vibrate(
              6
            ),
          92
        );

      }


      await bounce.finished;

    }


    coinPos = {
      x:finalX,
      y:finalY
    };


    currentFace =
      outcome;


    cancelAnimations();

    setRest();


    /*
      Single.
    */

    if(
      mode ===
      'single'
    ){

      showResult(
        outcome
      );


      flipping =
        false;


      hint.style.opacity =
        '1';


      return;

    }


    /*
      Best of 3.
    */

    series[outcome]++;


    updateScore();


    if(
      series[outcome] >= 2
    ){

      showResult(
        `${outcome} wins`,
        'Best of 3'
      );


      await wait(
        1300
      );


      series = {
        heads:0,
        tails:0
      };


      updateScore();


      flipping =
        false;


      hint.style.opacity =
        '1';


      return;

    }


    showResult(
      outcome,
      `${series.heads}–${series.tails}`
    );


    await wait(
      480
    );


    clearResult();


    flipping =
      false;


    hint.style.opacity =
      '1';


    await wait(
      120
    );


    const angle =
      secureFloat(
        0,
        Math.PI*2
      );


    doFlip({

      vx:
        Math.cos(
          angle
        ),

      vy:
        Math.sin(
          angle
        ),

      strength:
        secureFloat(
          .85,
          1.35
        ),

      spinBias:
        secureFloat(
          -.4,
          .4
        )

    });

  }
  catch(error){

    recover(
      error
    );

  }

}


/* ---------- Touch / pointer ---------- */

let drag =
  null;


function hitTest(
  x,
  y
){

  const rect =
    coinWrap
      .getBoundingClientRect();


  const centerX =
    rect.left +
    rect.width/2;


  const centerY =
    rect.top +
    rect.height/2;


  const radius =
    Math.min(
      rect.width,
      rect.height
    )*.54;


  return {

    inside:
      Math.hypot(
        x-centerX,
        y-centerY
      ) <= radius,

    cx:centerX,

    cy:centerY,

    radius

  };

}


stage.addEventListener(
  'pointerdown',
  event => {

    warmAudio();


    if(
      flipping
    ){

      return;

    }


    const hit =
      hitTest(
        event.clientX,
        event.clientY
      );


    if(
      !hit.inside
    ){

      return;

    }


    try{

      stage.setPointerCapture(
        event.pointerId
      );

    }
    catch(_){}


    const now =
      performance.now();


    drag = {

      id:
        event.pointerId,

      startX:
        event.clientX,

      startY:
        event.clientY,

      startTime:
        now,

      centerX:
        hit.cx,

      centerY:
        hit.cy,

      radius:
        hit.radius,

      samples:[
        {
          x:event.clientX,
          y:event.clientY,
          time:now
        }
      ]

    };


    coinWrap
      .classList
      .add(
        'dragging'
      );

  }
);


stage.addEventListener(
  'pointermove',
  event => {

    if(
      !drag ||
      event.pointerId !==
      drag.id ||
      flipping
    ){

      return;

    }


    const now =
      performance.now();


    const dx =
      event.clientX -
      drag.startX;


    const dy =
      event.clientY -
      drag.startY;


    const previewX =
      clamp(
        dx*.20,
        -46,
        46
      );


    const previewY =
      clamp(
        dy*.20,
        -46,
        46
      );


    const twist =
      clamp(
        dx*.07,
        -16,
        16
      );


    coinWrap.style.transform =
      `translate3d(
        ${coinPos.x+previewX}px,
        ${coinPos.y+previewY}px,
        0
      )
      rotateX(
        ${clamp(-previewY*.1,-5,5)}deg
      )
      rotateY(
        ${clamp(previewX*.1,-5,5)}deg
      )
      rotateZ(
        ${twist}deg
      )`;


    shadow.style.transform =
      `translate(
        calc(
          -50% +
          ${coinPos.x+previewX}px
        ),
        ${coinPos.y+previewY}px
      )
      scale(.98)`;


    drag.samples.push({

      x:
        event.clientX,

      y:
        event.clientY,

      time:
        now

    });


    while(
      drag.samples.length>2 &&
      now -
      drag.samples[0].time >
      100
    ){

      drag.samples.shift();

    }

  }
);


function finishGesture(
  event,
  cancelled=false
){

  if(
    !drag ||
    event.pointerId !==
    drag.id
  ){

    return;

  }


  const gesture =
    drag;


  drag =
    null;


  coinWrap
    .classList
    .remove(
      'dragging'
    );


  setRest();


  if(
    cancelled ||
    flipping
  ){

    return;

  }


  const end =
    performance.now();


  const dx =
    event.clientX -
    gesture.startX;


  const dy =
    event.clientY -
    gesture.startY;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  const oldest =
    gesture.samples[0];


  const dt =
    Math.max(
      16,
      end -
      oldest.time
    );


  let vx =
    (
      event.clientX -
      oldest.x
    ) /
    dt;


  let vy =
    (
      event.clientY -
      oldest.y
    ) /
    dt;


  if(
    Math.hypot(
      vx,
      vy
    ) < .12 &&
    distance > 12
  ){

    const total =
      Math.max(
        40,
        end -
        gesture.startTime
      );


    vx =
      dx /
      total;


    vy =
      dy /
      total;

  }


  const speed =
    Math.hypot(
      vx,
      vy
    );


  const contactX =
    clamp(
      (
        gesture.startX -
        gesture.centerX
      ) /
      gesture.radius,
      -1,
      1
    );


  const contactY =
    clamp(
      (
        gesture.startY -
        gesture.centerY
      ) /
      gesture.radius,
      -1,
      1
    );


  const spinBias =
    clamp(
      contactX -
      contactY*.15,
      -1,
      1
    );


  if(
    distance >= 12 ||
    speed >= .14
  ){

    doFlip({

      vx,

      vy,

      strength:
        clamp(
          .72 +
          speed +
          Math.min(
            distance,
            260
          ) / 320,
          .72,
          2.4
        ),

      spinBias

    });

  }
  else{

    doFlip({

      vx:
        contactX *
        secureFloat(
          .18,
          .48
        ),

      vy:
        -secureFloat(
          .55,
          .95
        ) +
        contactY*.15,

      strength:
        .76 +
        clamp(
          Math.hypot(
            contactX,
            contactY
          ),
          0,
          1
        )*.25,

      spinBias

    });

  }

}


stage.addEventListener(
  'pointerup',
  event =>
    finishGesture(
      event
    )
);


stage.addEventListener(
  'pointercancel',
  event =>
    finishGesture(
      event,
      true
    )
);


stage.addEventListener(
  'touchmove',
  event =>
    event.preventDefault(),
  {
    passive:false
  }
);

/* ---------- Directional shake ---------- */

let motionEnabled =
  false;

let motionSamples =
  0;

let motionTimer =
  null;

let motionListenerAttached =
  false;

let genericSensor =
  null;

let shakeCapture =
  null;

let shakeCooldownUntil =
  0;


let dmGravityReady =
  false;


let dmGravity = {
  x:0,
  y:0,
  z:0
};


let genericGravityReady =
  false;


let genericGravity = {
  x:0,
  y:0,
  z:0
};


function markMotionReady(){

  motionSamples++;


  if(
    motionEnabled
  ){

    return;

  }


  motionEnabled =
    true;


  motionBtn.textContent =
    'Shake ✓';


  statusEl.textContent =
    'Shake ready · directional motion connected';


  if(
    motionTimer
  ){

    clearTimeout(
      motionTimer
    );

  }

}


function sensorToScreen(
  x,
  y
){

  const angle =
    (
      (
        Number(
          screen.orientation?.angle ??
          window.orientation ??
          0
        ) %
        360
      ) +
      360
    ) %
    360;


  let sx =
    x;


  let sy =
    y;


  if(
    angle === 90
  ){

    sx =
      -y;

    sy =
      x;

  }

  else if(
    angle === 180
  ){

    sx =
      -x;

    sy =
      -y;

  }

  else if(
    angle === 270
  ){

    sx =
      y;

    sy =
      -x;

  }


  return {
    x:sx,
    y:-sy
  };

}


function addLinearAcceleration(
  x,
  y,
  z
){

  markMotionReady();


  if(
    flipping ||
    performance.now() <
    shakeCooldownUntil
  ){

    return;

  }


  const magnitude =
    Math.hypot(
      x,
      y,
      z
    );


  if(
    !shakeCapture
  ){

    if(
      magnitude <
      4.5
    ){

      return;

    }


    shakeCapture = {

      firstX:x,
      firstY:y,
      firstZ:z,

      sumX:0,
      sumY:0,
      sumZ:0,

      weight:0,

      peakX:x,
      peakY:y,
      peakZ:z,

      peakMag:
        magnitude,

      samples:0

    };


    setTimeout(
      finishShakeCapture,
      125
    );

  }


  if(
    !shakeCapture ||
    magnitude < .7
  ){

    return;

  }


  const weight =
    Math.min(
      magnitude,
      18
    );


  shakeCapture.sumX +=
    x*weight;


  shakeCapture.sumY +=
    y*weight;


  shakeCapture.sumZ +=
    z*weight;


  shakeCapture.weight +=
    weight;


  shakeCapture.samples++;


  if(
    magnitude >
    shakeCapture.peakMag
  ){

    Object.assign(
      shakeCapture,
      {
        peakX:x,
        peakY:y,
        peakZ:z,
        peakMag:magnitude
      }
    );

  }

}


function finishShakeCapture(){

  const data =
    shakeCapture;


  shakeCapture =
    null;


  if(
    !data ||
    data.samples < 2 ||
    data.peakMag < 4.5 ||
    flipping
  ){

    return;

  }


  shakeCooldownUntil =
    performance.now() +
    650;


  const avgX =
    data.weight
      ? data.sumX /
        data.weight
      : data.firstX;


  const avgY =
    data.weight
      ? data.sumY /
        data.weight
      : data.firstY;


  const avgZ =
    data.weight
      ? data.sumZ /
        data.weight
      : data.firstZ;


  const impulseX =
    data.firstX*.70 +
    avgX*.20 +
    data.peakX*.10;


  const impulseY =
    data.firstY*.70 +
    avgY*.20 +
    data.peakY*.10;


  const impulseZ =
    data.firstZ*.70 +
    avgZ*.20 +
    data.peakZ*.10;


  let {
    x:vx,
    y:vy
  } =
    sensorToScreen(
      impulseX,
      impulseY
    );


  let xy =
    Math.hypot(
      vx,
      vy
    );


  if(
    xy < .45
  ){

    const angle =
      secureFloat(
        0,
        Math.PI*2
      );


    vx =
      Math.cos(
        angle
      );


    vy =
      Math.sin(
        angle
      );

  }
  else{

    vx /=
      xy;


    vy /=
      xy;

  }


  const strength =
    clamp(
      .88 +
      data.peakMag/10 +
      Math.min(
        Math.abs(
          impulseZ
        ) / 14,
        .65
      ),
      .9,
      2.25
    );


  doFlip({

    vx,

    vy,

    strength,

    spinBias:
      clamp(
        vx*.4,
        -.5,
        .5
      )

  });

}


function handleDeviceMotion(
  event
){

  if(
    event.acceleration?.x != null &&
    event.acceleration?.y != null &&
    event.acceleration?.z != null
  ){

    addLinearAcceleration(

      Number(
        event.acceleration.x
      ),

      Number(
        event.acceleration.y
      ),

      Number(
        event.acceleration.z
      )

    );


    return;

  }


  const acceleration =
    event.accelerationIncludingGravity;


  if(
    !acceleration ||
    acceleration.x == null ||
    acceleration.y == null ||
    acceleration.z == null
  ){

    return;

  }


  const x =
    Number(
      acceleration.x
    );


  const y =
    Number(
      acceleration.y
    );


  const z =
    Number(
      acceleration.z
    );


  if(
    !dmGravityReady
  ){

    dmGravity = {
      x,
      y,
      z
    };


    dmGravityReady =
      true;


    markMotionReady();


    return;

  }


  const alpha =
    .88;


  dmGravity.x =
    alpha*dmGravity.x +
    (
      1-alpha
    )*x;


  dmGravity.y =
    alpha*dmGravity.y +
    (
      1-alpha
    )*y;


  dmGravity.z =
    alpha*dmGravity.z +
    (
      1-alpha
    )*z;


  addLinearAcceleration(

    x-dmGravity.x,

    y-dmGravity.y,

    z-dmGravity.z

  );

}


async function startGenericAccelerometer(){

  if(
    !(
      'Accelerometer'
      in window
    ) ||
    genericSensor
  ){

    return false;

  }


  try{

    if(
      navigator.permissions?.query
    ){

      try{

        const permission =
          await navigator.permissions.query({
            name:'accelerometer'
          });


        if(
          permission.state ===
          'denied'
        ){

          return false;

        }

      }
      catch(_){}

    }


    const sensor =
      new Accelerometer({
        frequency:50
      });


    sensor.addEventListener(
      'reading',
      () => {

        const x =
          Number(
            sensor.x ||
            0
          );


        const y =
          Number(
            sensor.y ||
            0
          );


        const z =
          Number(
            sensor.z ||
            0
          );


        if(
          !genericGravityReady
        ){

          genericGravity = {
            x,
            y,
            z
          };


          genericGravityReady =
            true;


          markMotionReady();


          return;

        }


        const alpha =
          .88;


        genericGravity.x =
          alpha*genericGravity.x +
          (
            1-alpha
          )*x;


        genericGravity.y =
          alpha*genericGravity.y +
          (
            1-alpha
          )*y;


        genericGravity.z =
          alpha*genericGravity.z +
          (
            1-alpha
          )*z;


        addLinearAcceleration(

          x-genericGravity.x,

          y-genericGravity.y,

          z-genericGravity.z

        );

      }
    );


    sensor.addEventListener(
      'error',
      () => {}
    );


    sensor.start();


    genericSensor =
      sensor;


    return true;

  }
  catch(_){

    return false;

  }

}


async function enableMotion(){

  motionSamples =
    0;


  motionEnabled =
    false;


  shakeCapture =
    null;


  dmGravityReady =
    false;


  genericGravityReady =
    false;


  motionBtn.textContent =
    'Testing…';


  statusEl.textContent =
    'Waiting for Android motion data…';


  if(
    !window.isSecureContext
  ){

    motionBtn.textContent =
      'Needs HTTPS';


    statusEl.textContent =
      'Shake requires the GitHub Pages HTTPS version.';


    return;

  }


  try{

    if(
      'DeviceMotionEvent'
      in window &&
      !motionListenerAttached
    ){

      if(
        typeof
        DeviceMotionEvent
          .requestPermission ===
        'function'
      ){

        const permission =
          await
          DeviceMotionEvent
            .requestPermission();


        if(
          permission ===
          'granted'
        ){

          window.addEventListener(
            'devicemotion',
            handleDeviceMotion,
            {
              passive:true
            }
          );


          motionListenerAttached =
            true;

        }

      }
      else{

        window.addEventListener(
          'devicemotion',
          handleDeviceMotion,
          {
            passive:true
          }
        );


        motionListenerAttached =
          true;

      }

    }

  }
  catch(_){}


  setTimeout(
    () => {

      if(
        motionSamples ===
        0
      ){

        startGenericAccelerometer();

      }

    },
    700
  );


  motionTimer =
    setTimeout(
      () => {

        if(
          motionSamples ===
          0
        ){

          motionEnabled =
            false;


          motionBtn.textContent =
            'Shake Blocked';


          statusEl.textContent =
            'No motion data received. Open the GitHub Pages URL directly in Chrome and allow Motion sensors.';

        }

      },
      2800
    );

}


motionBtn.addEventListener(
  'click',
  () => {

    warmAudio();


    if(
      !motionEnabled
    ){

      enableMotion();

    }

  }
);


/* ---------- Safety / resize ---------- */

document
  .querySelectorAll(
    '.quarter-photo'
  )
  .forEach(
    image =>
      image.addEventListener(
        'error',
        () => {

          statusEl.textContent =
            'Could not load the quarter image. Check your connection.';

        }
      )
  );


window.addEventListener(
  'error',
  event => {

    if(
      flipping
    ){

      recover(
        event.error ||
        new Error(
          event.message
        )
      );

    }

  }
);


window.addEventListener(
  'unhandledrejection',
  event => {

    if(
      flipping
    ){

      recover(
        event.reason ||
        new Error(
          'Unhandled promise rejection'
        )
      );

    }

  }
);


let resizeTimer =
  null;


function scheduleClamp(){

  clearTimeout(
    resizeTimer
  );


  resizeTimer =
    setTimeout(
      () => {

        if(
          !flipping
        ){

          clampToStage();

        }

      },
      80
    );

}


window.addEventListener(
  'resize',
  scheduleClamp,
  {
    passive:true
  }
);


window.addEventListener(
  'orientationchange',
  scheduleClamp,
  {
    passive:true
  }
);


if(
  window.visualViewport
){

  window.visualViewport
    .addEventListener(
      'resize',
      scheduleClamp,
      {
        passive:true
      }
    );

}


setRest();

})();
</script>
