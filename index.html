<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Coin Flip</title>

<link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg">

<link
  rel="preload"
  as="image"
  href="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg"
>

<link
  rel="preload"
  as="image"
  href="https://upload.wikimedia.org/wikipedia/commons/e/eb/United_States_Quarter_Reverse_2021.jpg"
>

<style>
:root{
  color-scheme:dark;

  --bg:#0f1115;
  --panel:#171a20;
  --panel2:#1d2129;

  --text:#f5f7fb;
  --muted:#9ba3b0;
  --line:#2b313d;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;

  overflow:hidden;

  background:var(--bg);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);
}

body{
  overscroll-behavior:none;
  touch-action:manipulation;
}

.app{
  height:100dvh;

  display:grid;

  grid-template-rows:
    auto
    1fr
    auto;

  gap:12px;

  padding:
    calc(env(safe-area-inset-top) + 16px)
    18px
    calc(env(safe-area-inset-bottom) + 18px);

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(255,255,255,.055),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #101319,
      #0c0e12
    );
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:center;
}

.mode{
  display:flex;

  gap:4px;

  padding:4px;

  border:
    1px solid
    var(--line);

  border-radius:14px;

  background:var(--panel);
}

.mode button{
  border:0;

  padding:
    9px
    12px;

  border-radius:10px;

  background:transparent;

  color:var(--muted);

  font-weight:750;
}

.mode button.active{
  color:var(--text);

  background:var(--panel2);

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.22);
}

.stage{
  position:relative;

  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  perspective:1200px;

  touch-action:none;
  user-select:none;
}

.hint{
  position:absolute;

  top:4%;
  left:50%;

  transform:
    translateX(-50%);

  width:
    min(
      92%,
      460px
    );

  text-align:center;

  color:var(--muted);

  font-size:14px;
  line-height:1.4;

  pointer-events:none;

  transition:
    opacity
    .2s;
}

.score{
  position:absolute;

  top:13%;
  left:50%;

  transform:
    translateX(-50%);

  opacity:0;

  color:var(--muted);

  font-size:14px;
  font-weight:750;

  pointer-events:none;

  transition:
    opacity
    .2s;
}

.score.show{
  opacity:1;
}

.coin-wrap{
  position:relative;

  width:210px;
  height:210px;

  transform-style:
    preserve-3d;

  will-change:
    transform;

  cursor:grab;
}

.coin-wrap.dragging{
  cursor:grabbing;
}

.coin{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  transform-style:
    preserve-3d;

  will-change:
    transform;
}

.face,
.edge{
  position:absolute;

  inset:0;

  border-radius:50%;

  backface-visibility:hidden;
}

.face{
  overflow:hidden;

  border:
    3px solid
    #adb2ba;

  background:#c8ccd2;

  box-shadow:
    inset
    0 0 0 1px
    rgba(255,255,255,.5),

    inset
    0 0 14px
    rgba(0,0,0,.18),

    0 18px 34px
    rgba(0,0,0,.42);
}

.heads{
  transform:
    translateZ(8px);
}

.tails{
  transform:
    rotateY(180deg)
    translateZ(8px);
}

.quarter-photo{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;

  transform:
    scale(1.015);

  filter:
    contrast(1.05)
    brightness(.98);

  pointer-events:none;
  user-select:none;
}

.edge{
  transform:
    translateZ(0);

  border:
    8px solid
    #8e949d;

  background:
    repeating-linear-gradient(
      90deg,
      #666c74 0 1px,
      #d8dbe0 1px 2px,
      #838992 2px 3px,
      #c3c7cd 3px 4px
    );

  box-shadow:
    inset
    0 0 8px
    rgba(0,0,0,.32);
}

.shadow{
  position:absolute;

  left:50%;

  top:
    calc(
      50% +
      135px
    );

  width:132px;
  height:26px;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.46),
      rgba(0,0,0,.13) 45%,
      rgba(0,0,0,0) 72%
    );

  filter:
    blur(4px);

  opacity:.64;

  pointer-events:none;

  will-change:
    transform,
    opacity;
}

.result{
  position:absolute;

  left:50%;
  bottom:7%;

  transform:
    translateX(-50%)
    translateY(8px);

  opacity:0;

  text-align:center;

  font-size:28px;
  font-weight:850;
  letter-spacing:.5px;

  pointer-events:none;

  transition:
    opacity .22s,
    transform .22s;
}

.result.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

.result small{
  display:block;

  margin-top:5px;

  color:var(--muted);

  font-size:13px;
  font-weight:700;
}

.controls{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:9px;
}

.pill{
  min-width:0;

  padding:
    13px
    15px;

  border:
    1px solid
    var(--line);

  border-radius:16px;

  background:var(--panel);

  color:var(--text);

  font-size:14px;
  font-weight:800;
}

.pill.secondary{
  color:var(--muted);
}

.pill:active{
  transform:
    scale(.97);
}

.status{
  min-height:17px;

  margin-top:6px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

@media(max-height:650px){

  .coin-wrap{
    width:165px;
    height:165px;
  }

  .shadow{
    top:
      calc(
        50% +
        107px
      );
  }

  .result{
    bottom:2%;
  }

  .hint{
    top:1%;
  }

}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="mode">

      <button
        id="singleBtn"
        class="active"
      >
        Single
      </button>

      <button
        id="bo3Btn"
      >
        Best of 3
      </button>

    </div>

  </header>


  <main
    class="stage"
    id="stage"
  >

    <div
      class="hint"
      id="hint"
    >
      Flick it any direction, tap it, or shake your phone
    </div>

    <div
      class="score"
      id="score"
    >
      Heads 0 · Tails 0
    </div>

    <div
      class="shadow"
      id="shadow"
    ></div>


    <div
      class="coin-wrap"
      id="coinWrap"
    >

      <div
        class="coin"
        id="coin"
      >

        <div class="face heads">

          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg"
            alt="Heads"
            draggable="false"
          >

        </div>


        <div class="face tails">

          <img
            class="quarter-photo"
            src="https://upload.wikimedia.org/wikipedia/commons/e/eb/United_States_Quarter_Reverse_2021.jpg"
            alt="Tails"
            draggable="false"
          >

        </div>


        <div class="edge"></div>

      </div>

    </div>


    <div
      class="result"
      id="result"
    ></div>

  </main>


  <footer>

    <div class="controls">

      <button
        class="pill secondary"
        id="motionBtn"
      >
        Enable Shake
      </button>

      <button
        class="pill"
        id="flipBtn"
      >
        Flip
      </button>

      <button
        class="pill secondary"
        id="soundBtn"
      >
        Sound On
      </button>

    </div>


    <div
      class="status"
      id="status"
    >
      Secure 50/50 randomness
    </div>

  </footer>

</div>


<script>
(() => {

'use strict';


const stage =
  document.getElementById(
    'stage'
  );

const coinWrap =
  document.getElementById(
    'coinWrap'
  );

const coin =
  document.getElementById(
    'coin'
  );

const shadow =
  document.getElementById(
    'shadow'
  );

const resultEl =
  document.getElementById(
    'result'
  );

const scoreEl =
  document.getElementById(
    'score'
  );

const hint =
  document.getElementById(
    'hint'
  );

const singleBtn =
  document.getElementById(
    'singleBtn'
  );

const bo3Btn =
  document.getElementById(
    'bo3Btn'
  );

const motionBtn =
  document.getElementById(
    'motionBtn'
  );

const flipBtn =
  document.getElementById(
    'flipBtn'
  );

const soundBtn =
  document.getElementById(
    'soundBtn'
  );

const statusEl =
  document.getElementById(
    'status'
  );


let mode =
  'single';

let flipping =
  false;

let soundOn =
  true;

let audioCtx =
  null;

let currentFace =
  'heads';


let coinPos = {
  x:0,
  y:0
};


let series = {
  heads:0,
  tails:0
};


/*
  SECURE RANDOMNESS
*/

function secureBit(){

  const a =
    new Uint32Array(1);


  crypto.getRandomValues(
    a
  );


  return (
    (a[0] & 1) === 0
      ? 'heads'
      : 'tails'
  );

}


function secureFloat(
  min,
  max
){

  const a =
    new Uint32Array(1);


  crypto.getRandomValues(
    a
  );


  return (
    min +
    (
      a[0] /
      4294967295
    ) *
    (
      max -
      min
    )
  );

}


function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/*
  SOUND + HAPTICS
*/

const COIN_IMPACT_URL =
  'https://upload.wikimedia.org/wikipedia/commons/c/c5/Coin_dropped_on_wooden_floor.ogg';


let coinImpactBuffer =
  null;


let coinImpactDecodePromise =
  null;


let audioBytesPromise =
  null;


let mediaFallback =
  null;


let mediaUnlocked =
  false;


/*
  Start downloading immediately.

  Playback still waits until
  a user gesture unlocks audio.
*/

function beginCoinAudioFetch(){

  if(
    audioBytesPromise
  ){

    return audioBytesPromise;

  }


  audioBytesPromise =

    fetch(
      COIN_IMPACT_URL,
      {
        mode:'cors',
        cache:'force-cache'
      }
    )

    .then(
      response => {

        if(
          !response.ok
        ){

          throw new Error(
            `Coin audio HTTP ${response.status}`
          );

        }


        return response
          .arrayBuffer();

      }
    )

    .catch(
      error => {

        console.warn(
          'Coin audio download failed:',
          error
        );


        return null;

      }
    );


  return audioBytesPromise;

}


function ensureAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioCtx.state ===
    'suspended'
  ){

    audioCtx
      .resume()
      .catch(
        () => {}
      );

  }


  return audioCtx;

}


function decodeCoinAudio(){

  if(
    coinImpactBuffer
  ){

    return Promise.resolve(
      coinImpactBuffer
    );

  }


  if(
    coinImpactDecodePromise
  ){

    return coinImpactDecodePromise;

  }


  const ctx =
    ensureAudio();


  coinImpactDecodePromise =

    beginCoinAudioFetch()

    .then(
      bytes => {

        if(!bytes){
          return null;
        }


        return ctx
          .decodeAudioData(
            bytes.slice(0)
          );

      }
    )

    .then(
      buffer => {

        coinImpactBuffer =
          buffer || null;


        return coinImpactBuffer;

      }
    )

    .catch(
      error => {

        console.warn(
          'Coin audio decode failed:',
          error
        );


        return null;

      }
    );


  return coinImpactDecodePromise;

}


/*
  Android Chrome needs audio
  unlocked during a real
  interaction.

  This runs on pointer-down /
  button presses.
*/

function warmAudio(){

  try{

    const ctx =
      ensureAudio();


    /*
      Tiny silent buffer activates
      the AudioContext while the
      user is interacting.
    */

    const silent =
      ctx.createBuffer(
        1,
        1,
        22050
      );


    const source =
      ctx.createBufferSource();


    source.buffer =
      silent;


    source.connect(
      ctx.destination
    );


    source.start();


    decodeCoinAudio();


    /*
      HTML Audio fallback.
    */

    if(
      !mediaFallback
    ){

      mediaFallback =
        new Audio(
          COIN_IMPACT_URL
        );


      mediaFallback.preload =
        'auto';


      mediaFallback.playsInline =
        true;


      mediaFallback.crossOrigin =
        'anonymous';

    }


    if(
      !mediaUnlocked
    ){

      const oldVolume =
        mediaFallback.volume;


      mediaFallback.volume =
        0;


      mediaFallback.currentTime =
        0;


      const attempt =
        mediaFallback.play();


      if(
        attempt &&
        typeof attempt.then ===
        'function'
      ){

        attempt

          .then(
            () => {

              mediaFallback.pause();


              mediaFallback.currentTime =
                0;


              mediaFallback.volume =
                oldVolume ||
                .45;


              mediaUnlocked =
                true;

            }
          )

          .catch(
            () => {

              mediaFallback.volume =
                oldVolume ||
                .45;

            }
          );

      }

    }

  }
  catch(error){

    console.warn(
      'Audio warm-up failed:',
      error
    );

  }

}


/*
  Generated metallic fallback.
*/

function fallbackMetalTick(
  intensity=1
){

  if(!soundOn){
    return;
  }


  try{

    const ctx =
      ensureAudio();


    const now =
      ctx.currentTime;


    [
      620,
      980,
      1540,
      2280
    ]

    .forEach(
      (
        frequency,
        index
      ) => {

        const oscillator =
          ctx
            .createOscillator();


        const gain =
          ctx
            .createGain();


        const filter =
          ctx
            .createBiquadFilter();


        oscillator.type =
          'sine';


        oscillator.frequency.value =
          frequency *
          secureFloat(
            .97,
            1.03
          );


        filter.type =
          'bandpass';


        filter.frequency.value =
          frequency;


        filter.Q.value =
          6;


        const level =
          (
            .028 /
            (
              index +
              1
            )
          ) *
          intensity;


        gain.gain
          .setValueAtTime(
            level,
            now +
            index*.003
          );


        gain.gain
          .exponentialRampToValueAtTime(
            .0001,
            now +
            .055 +
            index*.014
          );


        oscillator
          .connect(filter)
          .connect(gain)
          .connect(
            ctx.destination
          );


        oscillator.start(
          now +
          index*.003
        );


        oscillator.stop(
          now +
          .09 +
          index*.014
        );

      }
    );

  }
  catch(_){}

}


/*
  Play decoded real impact.
*/

function playBufferedImpact(
  intensity=1,
  secondary=false
){

  if(
    !coinImpactBuffer ||
    !audioCtx
  ){

    return false;

  }


  try{

    const source =
      audioCtx
        .createBufferSource();


    const gain =
      audioCtx
        .createGain();


    const highpass =
      audioCtx
        .createBiquadFilter();


    source.buffer =
      coinImpactBuffer;


    source.playbackRate.value =
      secondary

        ? secureFloat(
            1.08,
            1.16
          )

        : secureFloat(
            .97,
            1.04
          );


    gain.gain.value =
      clamp(

        secondary

          ? .07 +
            intensity*.07

          : .26 +
            intensity*.20,

        0,

        secondary
          ? .18
          : .54

      );


    highpass.type =
      'highpass';


    highpass.frequency.value =
      110;


    source
      .connect(highpass)
      .connect(gain)
      .connect(
        audioCtx.destination
      );


    source.start();


    return true;

  }
  catch(error){

    console.warn(
      'Buffered coin sound failed:',
      error
    );


    return false;

  }

}


function playCoinImpact(
  intensity=1,
  secondary=false
){

  if(!soundOn){
    return;
  }


  /*
    Preferred:
    decoded Web Audio.
  */

  if(
    playBufferedImpact(
      intensity,
      secondary
    )
  ){

    return;

  }


  /*
    Second:
    unlocked HTML audio.
  */

  if(
    mediaFallback &&
    mediaUnlocked
  ){

    try{

      mediaFallback.pause();


      mediaFallback.currentTime =
        0;


      mediaFallback.playbackRate =
        secondary

          ? secureFloat(
              1.08,
              1.16
            )

          : secureFloat(
              .97,
              1.04
            );


      mediaFallback.volume =
        clamp(

          secondary

            ? .08 +
              intensity*.07

            : .28 +
              intensity*.18,

          0,

          secondary
            ? .18
            : .52

        );


      const attempt =
        mediaFallback.play();


      if(
        attempt &&
        typeof attempt.catch ===
        'function'
      ){

        attempt.catch(
          () =>
            fallbackMetalTick(
              secondary
                ? intensity*.35
                : intensity
            )
        );

      }


      return;

    }
    catch(_){}

  }


  /*
    First flip may happen before
    decoding finishes.
  */

  decodeCoinAudio();


  fallbackMetalTick(
    secondary
      ? intensity*.35
      : intensity
  );

}


function vibrate(
  pattern
){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      pattern
    );

  }

}


/*
  UI
*/

function clearResult(){

  resultEl
    .classList
    .remove(
      'show'
    );

}


function showResult(
  text,
  sub=''
){

  resultEl.innerHTML =
    `${text.toUpperCase()}${
      sub
        ? `<small>${sub}</small>`
        : ''
    }`;


  resultEl
    .classList
    .add(
      'show'
    );

}


function updateScore(){

  scoreEl.textContent =
    `Heads ${series.heads} · Tails ${series.tails}`;

}


function setMode(
  newMode
){

  if(flipping){
    return;
  }


  mode =
    newMode;


  singleBtn
    .classList
    .toggle(
      'active',
      mode ===
      'single'
    );


  bo3Btn
    .classList
    .toggle(
      'active',
      mode ===
      'bo3'
    );


  scoreEl
    .classList
    .toggle(
      'show',
      mode ===
      'bo3'
    );


  series = {
    heads:0,
    tails:0
  };


  updateScore();

  clearResult();

}


/*
  POSITION
*/

function stageLimits(){

  const stageRect =
    stage
      .getBoundingClientRect();


  const coinRect =
    coinWrap
      .getBoundingClientRect();


  const radius =
    Math.min(
      coinRect.width,
      coinRect.height
    ) / 2;


  return {

    x:
      Math.max(
        20,
        stageRect.width/2 -
        radius -
        18
      ),

    y:
      Math.max(
        20,
        stageRect.height/2 -
        radius -
        48
      )

  };

}


function setRestingPosition(){

  coinWrap.style.transform =
    `translate3d(
      ${coinPos.x}px,
      ${coinPos.y}px,
      0
    )`;


  coin.style.transform =
    `rotateY(${
      currentFace ===
      'tails'
        ? 180
        : 0
    }deg)
    scale(1)`;


  shadow.style.transform =
    `translate(
      calc(
        -50% +
        ${coinPos.x}px
      ),
      ${coinPos.y}px
    )
    scale(1)`;


  shadow.style.opacity =
    '.64';

}


function cancelAnimations(){

  [
    coinWrap,
    coin,
    shadow
  ]

  .forEach(
    element => {

      element
        .getAnimations()
        .forEach(
          animation =>
            animation.cancel()
        );

    }
  );

}


function clampCoinToStage(){

  const limits =
    stageLimits();


  const nextX =
    clamp(
      coinPos.x,
      -limits.x,
      limits.x
    );


  const nextY =
    clamp(
      coinPos.y,
      -limits.y,
      limits.y
    );


  if(
    nextX ===
    coinPos.x &&
    nextY ===
    coinPos.y
  ){

    return;

  }


  coinPos.x =
    nextX;


  coinPos.y =
    nextY;


  cancelAnimations();

  setRestingPosition();

}


function unlockAfterError(
  error
){

  console.error(
    error
  );


  flipping =
    false;


  hint.style.opacity =
    '1';


  coinWrap
    .classList
    .remove(
      'dragging'
    );


  try{

    cancelAnimations();

    clampCoinToStage();

    setRestingPosition();

  }
  catch(_){}


  statusEl.textContent =
    'Recovered from an animation error · try again';

}


/*
  FLIP PHYSICS
*/

async function doFlip(
  gesture={}
){

  if(flipping){
    return;
  }


  flipping =
    true;


  clearResult();


  hint.style.opacity =
    '.15';


  try{

    warmAudio();

    cancelAnimations();

    clampCoinToStage();

    setRestingPosition();


    /*
      Crypto chooses the result
      BEFORE physics.
    */

    const outcome =
      secureBit();


    let vx =
      Number(
        gesture.vx || 0
      );


    let vy =
      Number(
        gesture.vy || 0
      );


    if(
      Math.abs(vx) < .01 &&
      Math.abs(vy) < .01
    ){

      const angle =
        secureFloat(
          0,
          Math.PI*2
        );


      vx =
        Math.cos(
          angle
        );


      vy =
        Math.sin(
          angle
        );

    }


    const velocity =
      Math.hypot(
        vx,
        vy
      );


    const dirX =
      vx /
      Math.max(
        velocity,
        .001
      );


    const dirY =
      vy /
      Math.max(
        velocity,
        .001
      );


    const strength =
      clamp(
        Number(
          gesture.strength ||
          1
        ),
        .65,
        2.4
      );


    const limits =
      stageLimits();


    const upwardAmount =
      clamp(
        -dirY,
        0,
        1
      );


    const downwardAmount =
      clamp(
        dirY,
        0,
        1
      );


    const sidewaysAmount =
      Math.abs(
        dirX
      );


    let travelX =
      dirX *
      (
        65 +
        strength*95
      );


    let travelY =
      dirY *
      (
        35 +
        strength*48
      );


    /*
      Sideways.
    */

    if(
      sidewaysAmount > .72 &&
      Math.abs(dirY) < .55
    ){

      travelX =
        dirX *
        (
          105 +
          strength*115
        );


      travelY =
        dirY *
        (
          22 +
          strength*25
        );

    }


    /*
      Downward.
    */

    if(
      downwardAmount > .58
    ){

      travelY =
        dirY *
        (
          70 +
          strength*75
        );

    }


    /*
      Upward.
    */

    if(
      upwardAmount > .58
    ){

      travelY =
        dirY *
        (
          75 +
          strength*90
        );

    }


    const startX =
      coinPos.x;


    const startY =
      coinPos.y;


    /*
      Gentle center bias when
      already near an edge.
    */

    const edgeRatioX =
      Math.abs(
        startX
      ) /
      Math.max(
        1,
        limits.x
      );


    const edgeRatioY =
      Math.abs(
        startY
      ) /
      Math.max(
        1,
        limits.y
      );


    if(
      edgeRatioX > .72
    ){

      travelX +=
        -Math.sign(
          startX
        ) *
        (
          edgeRatioX -
          .72
        ) *
        70;

    }


    if(
      edgeRatioY > .72
    ){

      travelY +=
        -Math.sign(
          startY
        ) *
        (
          edgeRatioY -
          .72
        ) *
        55;

    }


    const rawTargetX =
      startX +
      travelX;


    const rawTargetY =
      startY +
      travelY;


    const hitEdgeX =
      rawTargetX <
      -limits.x ||
      rawTargetX >
      limits.x;


    const hitEdgeY =
      rawTargetY <
      -limits.y ||
      rawTargetY >
      limits.y;


    const hitEdge =
      hitEdgeX ||
      hitEdgeY;


    const targetX =
      clamp(
        rawTargetX,
        -limits.x,
        limits.x
      );


    const targetY =
      clamp(
        rawTargetY,
        -limits.y,
        limits.y
      );


    const contactBias =
      clamp(
        Number(
          gesture.spinBias ||
          0
        ),
        -1,
        1
      );


    let spinDirection =
      Math.sign(
        vx*.8 +
        contactBias
      );


    if(
      spinDirection === 0
    ){

      spinDirection =
        secureFloat(
          0,
          1
        ) < .5
          ? -1
          : 1;

    }


    const startRotation =
      currentFace ===
      'tails'
        ? 180
        : 0;


    const turns =
      Math.round(
        secureFloat(
          4,
          7
        ) +
        strength*1.7
      );


    const faceChange =
      outcome ===
      currentFace
        ? 0
        : 180;


    const endRotation =
      startRotation +
      spinDirection *
      (
        turns*360 +
        faceChange
      );


    const duration =
      clamp(
        960 +
        strength*250 +
        secureFloat(
          -90,
          120
        ),
        980,
        1660
      );


    /*
      Shared movement points.

      Coin and shadow use
      these exact same X/Y
      coordinates.
    */

    let points;


    if(
      downwardAmount > .58
    ){

      const diveX =
        startX +
        (
          targetX -
          startX
        )*.66;


      const diveY =
        clamp(
          startY +
          (
            75 +
            strength*80
          ),
          -limits.y,
          limits.y
        );


      const reboundY =
        clamp(
          targetY -
          (
            28 +
            strength*25
          ),
          -limits.y,
          limits.y
        );


      points = [

        {
          x:startX,
          y:startY,
          offset:0,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        },

        {
          x:diveX,
          y:diveY,
          offset:.38,
          shadowScale:.78,
          shadowOpacity:.42,
          coinScale:1.035
        },

        {
          x:targetX,
          y:reboundY,
          offset:.68,
          shadowScale:.84,
          shadowOpacity:.48,
          coinScale:1.025
        },

        {
          x:targetX,
          y:targetY,
          offset:1,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        }

      ];

    }


    else if(
      sidewaysAmount > .72 &&
      Math.abs(dirY) < .55
    ){

      const hop =
        38 +
        strength*28;


      const midX =
        startX +
        (
          targetX -
          startX
        )*.53;


      const midY =
        clamp(
          startY -
          hop,
          -limits.y,
          limits.y
        );


      points = [

        {
          x:startX,
          y:startY,
          offset:0,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        },

        {
          x:midX,
          y:midY,
          offset:.47,
          shadowScale:.72,
          shadowOpacity:.36,
          coinScale:1.045
        },

        {
          x:targetX,
          y:targetY,
          offset:1,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        }

      ];

    }


    else if(
      upwardAmount > .58
    ){

      const rise =
        125 +
        strength*85;


      const apexX =
        startX +
        (
          targetX -
          startX
        )*.42;


      const apexY =
        clamp(
          startY -
          rise,
          -limits.y,
          limits.y
        );


      points = [

        {
          x:startX,
          y:startY,
          offset:0,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        },

        {
          x:apexX,
          y:apexY,
          offset:.46,
          shadowScale:.48,
          shadowOpacity:.18,
          coinScale:1.07
        },

        {
          x:targetX,
          y:targetY,
          offset:1,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        }

      ];

    }


    else{

      const perpendicularX =
        -dirY;


      const perpendicularY =
        dirX;


      const arcStrength =
        secureFloat(
          22,
          46
        ) *
        (
          .8 +
          strength*.25
        );


      const midX =
        startX +
        (
          targetX -
          startX
        )*.52 +
        perpendicularX *
        arcStrength;


      const midY =
        startY +
        (
          targetY -
          startY
        )*.52 +
        perpendicularY *
        arcStrength;


      points = [

        {
          x:startX,
          y:startY,
          offset:0,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        },

        {
          x:midX,
          y:midY,
          offset:.5,
          shadowScale:.66,
          shadowOpacity:.32,
          coinScale:1.05
        },

        {
          x:targetX,
          y:targetY,
          offset:1,
          shadowScale:1,
          shadowOpacity:.64,
          coinScale:1
        }

      ];

    }


    const travelFrames =
      points.map(
        point => ({

          transform:
            `translate3d(
              ${point.x}px,
              ${point.y}px,
              0
            )`,

          offset:
            point.offset

        })
      );


    const shadowFrames =
      points.map(
        point => ({

          transform:
            `translate(
              calc(
                -50% +
                ${point.x}px
              ),
              ${point.y}px
            )
            scale(
              ${point.shadowScale}
            )`,

          opacity:
            point.shadowOpacity,

          offset:
            point.offset

        })
      );


    coinWrap.animate(
      travelFrames,
      {
        duration,
        easing:
          'cubic-bezier(.16,.68,.22,1)',
        fill:'forwards'
      }
    );


    shadow.animate(
      shadowFrames,
      {
        duration,
        easing:
          'cubic-bezier(.16,.68,.22,1)',
        fill:'forwards'
      }
    );


    const wobbleX =
      secureFloat(
        -48,
        48
      );


    const wobbleZ =
      clamp(
        dirX*36 +
        contactBias*18 +
        secureFloat(
          -8,
          8
        ),
        -55,
        55
      );


    const midScale =
      Math.max(
        ...points.map(
          point =>
            point.coinScale ||
            1
        )
      );


    coin.animate(
      [

        {
          transform:
            `rotateY(
              ${startRotation}deg
            )
            rotateX(0deg)
            rotateZ(0deg)
            scale(1)`,
          offset:0
        },

        {
          transform:
            `rotateY(
              ${
                startRotation +
                (
                  endRotation -
                  startRotation
                )*.48
              }deg
            )
            rotateX(
              ${wobbleX}deg
            )
            rotateZ(
              ${wobbleZ}deg
            )
            scale(
              ${midScale}
            )`,
          offset:.48
        },

        {
          transform:
            `rotateY(
              ${
                startRotation +
                (
                  endRotation -
                  startRotation
                )*.90
              }deg
            )
            rotateX(
              ${wobbleX*.16}deg
            )
            rotateZ(
              ${wobbleZ*.12}deg
            )
            scale(1.015)`,
          offset:.89
        },

        {
          transform:
            `rotateY(
              ${endRotation}deg
            )
            rotateX(0deg)
            rotateZ(0deg)
            scale(1)`,
          offset:1
        }

      ],
      {
        duration,
        easing:
          'cubic-bezier(.12,.54,.20,1)',
        fill:'forwards'
      }
    );


    await wait(
      duration*.87
    );


    playCoinImpact(
      clamp(
        .82 +
        strength*.18,
        .85,
        1.25
      ),
      false
    );


    vibrate(
      [
        20,
        26,
        10
      ]
    );


    await wait(
      duration*.13
    );


    let finalX =
      targetX;


    let finalY =
      targetY;


    /*
      Edge ricochet.
    */

    if(hitEdge){

      const inwardX =
        hitEdgeX

          ? -Math.sign(
              rawTargetX
            ) *
            (
              24 +
              strength*13
            )

          : dirX *
            (
              5 +
              strength*2
            );


      const inwardY =
        hitEdgeY

          ? -Math.sign(
              rawTargetY
            ) *
            (
              20 +
              strength*11
            )

          : -(
              7 +
              strength*3
            );


      finalX =
        clamp(
          targetX +
          inwardX,
          -limits.x,
          limits.x
        );


      finalY =
        clamp(
          targetY +
          inwardY,
          -limits.y,
          limits.y
        );


      const ricochetMs =
        210;


      coinWrap.animate(
        [

          {
            transform:
              `translate3d(
                ${targetX}px,
                ${targetY}px,
                0
              )`
          },

          {
            transform:
              `translate3d(
                ${finalX}px,
                ${finalY}px,
                0
              )`
          }

        ],
        {
          duration:
            ricochetMs,

          easing:
            'cubic-bezier(.18,.76,.28,1)',

          fill:
            'forwards'
        }
      );


      shadow.animate(
        [

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${targetX}px
                ),
                ${targetY}px
              )
              scale(.92)`,

            opacity:.58
          },

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${finalX}px
                ),
                ${finalY}px
              )
              scale(1)`,

            opacity:.64
          }

        ],
        {
          duration:
            ricochetMs,

          easing:
            'cubic-bezier(.18,.76,.28,1)',

          fill:
            'forwards'
        }
      );


      await wait(
        115
      );


      vibrate(
        7
      );


      await wait(
        95
      );

    }


    else{

      const bounceDistance =
        5 +
        strength*3;


      const bounceX =
        clamp(
          targetX +
          dirX*bounceDistance,
          -limits.x,
          limits.x
        );


      const bounceY =
        clamp(
          targetY -
          (
            8 +
            strength*5
          ),
          -limits.y,
          limits.y
        );


      coinWrap.animate(
        [

          {
            transform:
              `translate3d(
                ${targetX}px,
                ${targetY}px,
                0
              )`
          },

          {
            transform:
              `translate3d(
                ${bounceX}px,
                ${bounceY}px,
                0
              )`,
            offset:.35
          },

          {
            transform:
              `translate3d(
                ${targetX}px,
                ${targetY}px,
                0
              )`
          }

        ],
        {
          duration:220,
          easing:'ease-out',
          fill:'forwards'
        }
      );


      shadow.animate(
        [

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${targetX}px
                ),
                ${targetY}px
              )
              scale(1)`,

            opacity:.64
          },

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${bounceX}px
                ),
                ${bounceY}px
              )
              scale(.92)`,

            opacity:.56,

            offset:.35
          },

          {
            transform:
              `translate(
                calc(
                  -50% +
                  ${targetX}px
                ),
                ${targetY}px
              )
              scale(1)`,

            opacity:.64
          }

        ],
        {
          duration:220,
          easing:'ease-out',
          fill:'forwards'
        }
      );


      if(
        strength >
        1.25
      ){

        await wait(
          92
        );


        vibrate(
          6
        );


        await wait(
          128
        );

      }
      else{

        await wait(
          220
        );

      }

    }


    coinPos.x =
      finalX;


    coinPos.y =
      finalY;


    currentFace =
      outcome;


    cancelAnimations();

    setRestingPosition();


    /*
      Single.
    */

    if(
      mode ===
      'single'
    ){

      showResult(
        outcome
      );


      flipping =
        false;


      hint.style.opacity =
        '1';


      return;

    }


    /*
      Best of 3.
    */

    series[outcome]++;


    updateScore();


    if(
      series[outcome] >= 2
    ){

      showResult(
        `${outcome} wins`,
        'Best of 3'
      );


      await wait(
        1300
      );


      series = {
        heads:0,
        tails:0
      };


      updateScore();


      flipping =
        false;


      hint.style.opacity =
        '1';


      return;

    }


    showResult(
      outcome,
      `${series.heads}–${series.tails}`
    );


    await wait(
      480
    );


    clearResult();


    flipping =
      false;


    hint.style.opacity =
      '1';


    await wait(
      120
    );


    const randomAngle =
      secureFloat(
        0,
        Math.PI*2
      );


    doFlip({

      vx:
        Math.cos(
          randomAngle
        ),

      vy:
        Math.sin(
          randomAngle
        ),

      strength:
        secureFloat(
          .85,
          1.35
        ),

      spinBias:
        secureFloat(
          -.4,
          .4
        )

    });

  }
  catch(error){

    unlockAfterError(
      error
    );

  }

}


/*
  FINGER INPUT
*/

let drag =
  null;


function hitTestCoin(
  x,
  y
){

  const rect =
    coinWrap
      .getBoundingClientRect();


  const cx =
    rect.left +
    rect.width/2;


  const cy =
    rect.top +
    rect.height/2;


  const radius =
    Math.min(
      rect.width,
      rect.height
    )*.54;


  return {

    inside:
      Math.hypot(
        x-cx,
        y-cy
      ) <= radius,

    cx,
    cy,
    radius

  };

}


stage.addEventListener(
  'pointerdown',
  event => {

    warmAudio();


    if(flipping){
      return;
    }


    const hit =
      hitTestCoin(
        event.clientX,
        event.clientY
      );


    if(!hit.inside){
      return;
    }


    try{

      stage
        .setPointerCapture(
          event.pointerId
        );

    }
    catch(_){}


    const now =
      performance.now();


    drag = {

      id:
        event.pointerId,

      startX:
        event.clientX,

      startY:
        event.clientY,

      startTime:
        now,

      centerX:
        hit.cx,

      centerY:
        hit.cy,

      radius:
        hit.radius,

      samples:[
        {
          x:event.clientX,
          y:event.clientY,
          time:now
        }
      ]

    };


    coinWrap
      .classList
      .add(
        'dragging'
      );

  }
);


stage.addEventListener(
  'pointermove',
  event => {

    if(
      !drag ||
      event.pointerId !==
      drag.id ||
      flipping
    ){

      return;

    }


    const now =
      performance.now();


    const dx =
      event.clientX -
      drag.startX;


    const dy =
      event.clientY -
      drag.startY;


    const previewX =
      clamp(
        dx*.20,
        -46,
        46
      );


    const previewY =
      clamp(
        dy*.20,
        -46,
        46
      );


    const twist =
      clamp(
        dx*.07,
        -16,
        16
      );


    coinWrap.style.transform =
      `translate3d(
        ${coinPos.x + previewX}px,
        ${coinPos.y + previewY}px,
        0
      )
      rotateX(
        ${clamp(-previewY*.10,-5,5)}deg
      )
      rotateY(
        ${clamp(previewX*.10,-5,5)}deg
      )
      rotateZ(
        ${twist}deg
      )`;


    shadow.style.transform =
      `translate(
        calc(
          -50% +
          ${coinPos.x + previewX}px
        ),
        ${coinPos.y + previewY}px
      )
      scale(.98)`;


    drag.samples.push({

      x:
        event.clientX,

      y:
        event.clientY,

      time:
        now

    });


    while(
      drag.samples.length > 2 &&
      now -
      drag.samples[0].time >
      100
    ){

      drag.samples.shift();

    }

  }
);


function finishGesture(
  event,
  cancelled=false
){

  if(
    !drag ||
    event.pointerId !==
    drag.id
  ){

    return;

  }


  const gesture =
    drag;


  drag =
    null;


  coinWrap
    .classList
    .remove(
      'dragging'
    );


  setRestingPosition();


  if(
    cancelled ||
    flipping
  ){

    return;

  }


  const endTime =
    performance.now();


  const dx =
    event.clientX -
    gesture.startX;


  const dy =
    event.clientY -
    gesture.startY;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  const oldest =
    gesture.samples[0];


  const velocityTime =
    Math.max(
      16,
      endTime -
      oldest.time
    );


  let vx =
    (
      event.clientX -
      oldest.x
    ) /
    velocityTime;


  let vy =
    (
      event.clientY -
      oldest.y
    ) /
    velocityTime;


  if(
    Math.hypot(
      vx,
      vy
    ) < .12 &&
    distance > 12
  ){

    const totalTime =
      Math.max(
        40,
        endTime -
        gesture.startTime
      );


    vx =
      dx /
      totalTime;


    vy =
      dy /
      totalTime;

  }


  const speed =
    Math.hypot(
      vx,
      vy
    );


  const contactX =
    clamp(
      (
        gesture.startX -
        gesture.centerX
      ) /
      gesture.radius,
      -1,
      1
    );


  const contactY =
    clamp(
      (
        gesture.startY -
        gesture.centerY
      ) /
      gesture.radius,
      -1,
      1
    );


  const edgeAmount =
    clamp(
      Math.hypot(
        contactX,
        contactY
      ),
      0,
      1
    );


  const spinBias =
    clamp(
      contactX -
      contactY*.15,
      -1,
      1
    );


  if(
    distance >= 12 ||
    speed >= .14
  ){

    const strength =
      clamp(
        .72 +
        speed*1.0 +
        Math.min(
          distance,
          260
        ) / 320,
        .72,
        2.4
      );


    doFlip({

      vx,
      vy,
      strength,
      spinBias

    });


    return;

  }


  doFlip({

    vx:
      contactX *
      secureFloat(
        .18,
        .48
      ),

    vy:
      -secureFloat(
        .55,
        .95
      ) +
      contactY*.15,

    strength:
      .76 +
      edgeAmount*.25,

    spinBias

  });

}


stage.addEventListener(
  'pointerup',
  event =>
    finishGesture(

/*
  DIRECTIONAL SHAKE
*/

let motionEnabled =
  false;


let motionSamples =
  0;


let motionTimer =
  null;


let motionListenerAttached =
  false;


let genericSensor =
  null;


let shakeCapture =
  null;


let shakeCooldownUntil =
  0;


let dmGravityReady =
  false;


let dmGravity = {
  x:0,
  y:0,
  z:0
};


let genericGravityReady =
  false;


let genericGravity = {
  x:0,
  y:0,
  z:0
};


function markMotionReady(){

  motionSamples++;


  if(motionEnabled){
    return;
  }


  motionEnabled =
    true;


  motionBtn.textContent =
    'Shake ✓';


  statusEl.textContent =
    'Shake ready · directional motion connected';


  if(motionTimer){

    clearTimeout(
      motionTimer
    );

  }

}


function sensorToScreen(
  x,
  y
){

  const rawAngle =
    screen.orientation?.angle ??
    window.orientation ??
    0;


  const angle =
    (
      (
        Number(rawAngle) %
        360
      ) +
      360
    ) %
    360;


  let sx =
    x;


  let sy =
    y;


  if(
    angle === 90
  ){

    sx =
      -y;


    sy =
      x;

  }


  else if(
    angle === 180
  ){

    sx =
      -x;


    sy =
      -y;

  }


  else if(
    angle === 270
  ){

    sx =
      y;


    sy =
      -x;

  }


  return {

    x:sx,

    y:-sy

  };

}


function addLinearAcceleration(
  x,
  y,
  z
){

  markMotionReady();


  if(flipping){
    return;
  }


  const now =
    performance.now();


  if(
    now <
    shakeCooldownUntil
  ){

    return;

  }


  const magnitude =
    Math.hypot(
      x,
      y,
      z
    );


  if(!shakeCapture){

    if(
      magnitude <
      4.5
    ){

      return;

    }


    shakeCapture = {

      firstX:x,
      firstY:y,
      firstZ:z,

      sumX:0,
      sumY:0,
      sumZ:0,

      weightSum:0,

      peakX:x,
      peakY:y,
      peakZ:z,

      peakMag:
        magnitude,

      samples:0

    };


    setTimeout(
      finishShakeCapture,
      125
    );

  }


  if(
    !shakeCapture ||
    magnitude < .7
  ){

    return;

  }


  const weight =
    Math.min(
      magnitude,
      18
    );


  shakeCapture.sumX +=
    x * weight;


  shakeCapture.sumY +=
    y * weight;


  shakeCapture.sumZ +=
    z * weight;


  shakeCapture.weightSum +=
    weight;


  shakeCapture.samples++;


  if(
    magnitude >
    shakeCapture.peakMag
  ){

    shakeCapture.peakMag =
      magnitude;


    shakeCapture.peakX =
      x;


    shakeCapture.peakY =
      y;


    shakeCapture.peakZ =
      z;

  }

}


function finishShakeCapture(){

  const data =
    shakeCapture;


  shakeCapture =
    null;


  if(
    !data ||
    data.samples < 2 ||
    data.peakMag < 4.5 ||
    flipping
  ){

    return;

  }


  shakeCooldownUntil =
    performance.now() +
    650;


  const avgX =
    data.weightSum
      ? data.sumX /
        data.weightSum
      : data.firstX;


  const avgY =
    data.weightSum
      ? data.sumY /
        data.weightSum
      : data.firstY;


  const avgZ =
    data.weightSum
      ? data.sumZ /
        data.weightSum
      : data.firstZ;


  const impulseX =
    data.firstX*.70 +
    avgX*.20 +
    data.peakX*.10;


  const impulseY =
    data.firstY*.70 +
    avgY*.20 +
    data.peakY*.10;


  const impulseZ =
    data.firstZ*.70 +
    avgZ*.20 +
    data.peakZ*.10;


  const screenVector =
    sensorToScreen(
      impulseX,
      impulseY
    );


  let vx =
    screenVector.x;


  let vy =
    screenVector.y;


  let xy =
    Math.hypot(
      vx,
      vy
    );


  if(
    xy < .45
  ){

    const angle =
      secureFloat(
        0,
        Math.PI*2
      );


    vx =
      Math.cos(
        angle
      );


    vy =
      Math.sin(
        angle
      );


    xy =
      1;

  }
  else{

    vx /=
      xy;


    vy /=
      xy;

  }


  const zBoost =
    Math.min(
      Math.abs(
        impulseZ
      ) / 14,
      .65
    );


  const strength =
    clamp(
      .88 +
      data.peakMag/10 +
      zBoost,
      .9,
      2.25
    );


  doFlip({

    vx,
    vy,

    strength,

    spinBias:
      clamp(
        vx*.4,
        -.5,
        .5
      )

  });

}


function handleDeviceMotion(
  event
){

  if(
    event.acceleration &&
    event.acceleration.x != null &&
    event.acceleration.y != null &&
    event.acceleration.z != null
  ){

    addLinearAcceleration(

      Number(
        event.acceleration.x
      ),

      Number(
        event.acceleration.y
      ),

      Number(
        event.acceleration.z
      )

    );


    return;

  }


  const acceleration =
    event.accelerationIncludingGravity;


  if(
    !acceleration ||
    acceleration.x == null ||
    acceleration.y == null ||
    acceleration.z == null
  ){

    return;

  }


  const rawX =
    Number(
      acceleration.x
    );


  const rawY =
    Number(
      acceleration.y
    );


  const rawZ =
    Number(
      acceleration.z
    );


  if(
    !dmGravityReady
  ){

    dmGravity = {

      x:rawX,
      y:rawY,
      z:rawZ

    };


    dmGravityReady =
      true;


    markMotionReady();


    return;

  }


  const alpha =
    .88;


  dmGravity.x =
    alpha *
    dmGravity.x +
    (
      1-alpha
    ) *
    rawX;


  dmGravity.y =
    alpha *
    dmGravity.y +
    (
      1-alpha
    ) *
    rawY;


  dmGravity.z =
    alpha *
    dmGravity.z +
    (
      1-alpha
    ) *
    rawZ;


  addLinearAcceleration(

    rawX -
    dmGravity.x,

    rawY -
    dmGravity.y,

    rawZ -
    dmGravity.z

  );

}


async function startGenericAccelerometer(){

  if(
    !(
      'Accelerometer'
      in window
    ) ||
    genericSensor
  ){

    return false;

  }


  try{

    if(
      navigator.permissions?.query
    ){

      try{

        const permission =
          await navigator.permissions.query({
            name:
              'accelerometer'
          });


        if(
          permission.state ===
          'denied'
        ){

          return false;

        }

      }
      catch(_){}

    }


    const sensor =
      new Accelerometer({
        frequency:50
      });


    sensor.addEventListener(
      'reading',
      () => {

        const rawX =
          Number(
            sensor.x || 0
          );


        const rawY =
          Number(
            sensor.y || 0
          );


        const rawZ =
          Number(
            sensor.z || 0
          );


        if(
          !genericGravityReady
        ){

          genericGravity = {

            x:rawX,
            y:rawY,
            z:rawZ

          };


          genericGravityReady =
            true;


          markMotionReady();


          return;

        }


        const alpha =
          .88;


        genericGravity.x =
          alpha *
          genericGravity.x +
          (
            1-alpha
          ) *
          rawX;


        genericGravity.y =
          alpha *
          genericGravity.y +
          (
            1-alpha
          ) *
          rawY;


        genericGravity.z =
          alpha *
          genericGravity.z +
          (
            1-alpha
          ) *
          rawZ;


        addLinearAcceleration(

          rawX -
          genericGravity.x,

          rawY -
          genericGravity.y,

          rawZ -
          genericGravity.z

        );

      }
    );


    sensor.addEventListener(
      'error',
      () => {}
    );


    sensor.start();


    genericSensor =
      sensor;


    return true;

  }
  catch(_){

    return false;

  }

}


async function enableMotion(){

  motionSamples =
    0;


  motionEnabled =
    false;


  shakeCapture =
    null;


  dmGravityReady =
    false;


  genericGravityReady =
    false;


  motionBtn.textContent =
    'Testing…';


  statusEl.textContent =
    'Waiting for Android motion data…';


  if(
    !window.isSecureContext
  ){

    motionBtn.textContent =
      'Needs HTTPS';


    statusEl.textContent =
      'Shake requires the GitHub Pages HTTPS version.';


    return;

  }


  try{

    if(
      'DeviceMotionEvent'
      in window &&
      !motionListenerAttached
    ){

      if(
        typeof
        DeviceMotionEvent
          .requestPermission ===
        'function'
      ){

        const permission =
          await
          DeviceMotionEvent
            .requestPermission();


        if(
          permission ===
          'granted'
        ){

          window.addEventListener(
            'devicemotion',
            handleDeviceMotion,
            {
              passive:true
            }
          );


          motionListenerAttached =
            true;

        }

      }
      else{

        window.addEventListener(
          'devicemotion',
          handleDeviceMotion,
          {
            passive:true
          }
        );


        motionListenerAttached =
          true;

      }

    }

  }
  catch(_){}


  setTimeout(
    () => {

      if(
        motionSamples === 0
      ){

        startGenericAccelerometer();

      }

    },
    700
  );


  motionTimer =
    setTimeout(
      () => {

        if(
          motionSamples === 0
        ){

          motionEnabled =
            false;


          motionBtn.textContent =
            'Shake Blocked';


          statusEl.textContent =
            'No motion data received. Open the GitHub Pages URL directly in Chrome and allow Motion sensors.';

        }

      },
      2800
    );

}


motionBtn.addEventListener(

    warmAudio();


    if(

);
