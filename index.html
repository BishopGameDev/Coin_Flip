<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Coin Flip</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0f1115;
    --panel:#171a20;
    --panel2:#1d2129;
    --text:#f5f7fb;
    --muted:#9ba3b0;
    --line:#2b313d;
    --accent:#d6d9df;
    --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}
  body{overscroll-behavior:none;touch-action:manipulation}
  .app{
    height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);
    gap:12px;
    background:
      radial-gradient(circle at 50% 38%,rgba(255,255,255,.05),transparent 30%),
      linear-gradient(180deg,#101319,#0c0e12);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title{font-weight:750;letter-spacing:.2px;font-size:19px}
  .mode{
    display:flex;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:14px;gap:4px;
  }
  .mode button,.iconbtn{
    border:0;color:var(--muted);background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;
  }
  .mode button.active{background:var(--panel2);color:var(--text);box-shadow:0 3px 12px rgba(0,0,0,.22)}
  .stage{
    position:relative;display:flex;align-items:center;justify-content:center;min-height:0;
    perspective:1100px;touch-action:none;user-select:none;
  }
  .hint{
    position:absolute;top:5%;left:50%;transform:translateX(-50%);
    color:var(--muted);font-size:14px;text-align:center;width:min(92%,460px);line-height:1.35;
    transition:opacity .25s;
  }
  .score{
    position:absolute;top:15%;left:50%;transform:translateX(-50%);
    font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.3px;
    opacity:0;transition:opacity .2s;
  }
  .score.show{opacity:1}
  .coin-wrap{
    position:relative;width:210px;height:210px;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .coin{
    width:100%;height:100%;position:relative;transform-style:preserve-3d;
    border-radius:50%;
    will-change:transform;
  }
  .face,.edge{
    position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;
  }
  .face{
    overflow:hidden;border:3px solid #aeb3bc;
    background:
      radial-gradient(circle at 31% 24%,rgba(255,255,255,.95) 0 3%,rgba(245,246,248,.72) 7%,transparent 18%),
      radial-gradient(circle at 65% 72%,rgba(70,74,81,.22),transparent 28%),
      repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.045) 0 1px,rgba(0,0,0,.028) 1px 2px,transparent 2px 4px),
      linear-gradient(145deg,#f1f2f4 0%,#c8ccd2 18%,#9298a2 41%,#dadde2 61%,#a2a7af 78%,#d4d7dc 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.62),
      inset 0 0 0 7px rgba(74,79,88,.22),
      inset 0 0 20px rgba(0,0,0,.16),
      inset -17px -22px 24px rgba(34,38,44,.24),
      inset 15px 14px 18px rgba(255,255,255,.19),
      0 20px 34px rgba(0,0,0,.42);
  }
  .face:after{
    content:"";position:absolute;inset:10px;border-radius:50%;pointer-events:none;
    border:1px solid rgba(75,80,87,.38);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
  }
  .heads{transform:translateZ(8px)}
  .tails{transform:rotateY(180deg) translateZ(8px)}
  .face.real-quarter{
    background:#d8dadd;
    padding:0;
  }
  .face.real-quarter:after{
    display:none;
  }
  .quarter-photo{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    transform:scale(1.015);
    filter:contrast(1.04) brightness(.98);
    user-select:none;
    pointer-events:none;
  }
  .edge{
    transform:translateZ(0);
    background:repeating-linear-gradient(90deg,#6d737c 0 1px,#d7dae0 1px 2px,#878d96 2px 3px,#c6cad0 3px 4px);
    border:8px solid #8d939c;
    box-shadow:inset 0 0 8px rgba(0,0,0,.28);
  }
  .coin-text{position:absolute;left:50%;transform:translateX(-50%);font-family:Georgia,"Times New Roman",serif;color:#676c74;text-shadow:-1px -1px 0 rgba(255,255,255,.42),1px 1px 1px rgba(30,34,40,.22);font-weight:800;letter-spacing:1.05px}
  .liberty{top:16px;font-size:19px}
  .year{bottom:18px;font-size:18px}
  .quarter{top:18px;font-size:13px;letter-spacing:1px}
  .dollar{bottom:18px;font-size:14px;letter-spacing:.8px}
  .head-silhouette{
    position:absolute;left:57px;top:44px;width:95px;height:122px;
    background:linear-gradient(140deg,#777d85,#aeb3ba 52%,#696e75);
    border-radius:52% 48% 50% 46% / 38% 42% 58% 62%;
    transform:rotate(-7deg);
    box-shadow:inset 8px 6px 14px rgba(255,255,255,.18),inset -8px -10px 16px rgba(0,0,0,.16);
  }
  .head-silhouette:before{
    content:"";position:absolute;right:-9px;top:41px;width:25px;height:28px;background:#8d929a;
    clip-path:polygon(0 10%,100% 46%,23% 100%);
  }
  .head-silhouette:after{
    content:"";position:absolute;left:14px;bottom:-10px;width:75px;height:38px;background:#8f949b;border-radius:50% 48% 42% 44%;
  }
  .eagle{
    position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:132px;height:80px;
  }
  .wing{position:absolute;top:14px;width:67px;height:51px;background:linear-gradient(#aeb3ba,#72777f);border-radius:70% 25% 65% 20%;box-shadow:inset 0 8px 12px rgba(255,255,255,.14)}
  .wing.left{left:0;transform:rotate(-18deg)}
  .wing.right{right:0;transform:scaleX(-1) rotate(-18deg)}
  .eagle-body{position:absolute;left:49px;top:18px;width:36px;height:61px;background:linear-gradient(#b5bac1,#70757c);border-radius:48% 48% 55% 55%}
  .eagle-head{position:absolute;left:58px;top:0;width:25px;height:26px;background:#c8ccd2;border-radius:50%}
  .eagle-head:after{content:"";position:absolute;right:-9px;top:8px;border-left:12px solid #777c84;border-top:5px solid transparent;border-bottom:5px solid transparent}
  .shadow{
    position:absolute;left:50%;top:calc(50% + 135px);width:150px;height:34px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.52),rgba(0,0,0,0) 70%);
    filter:blur(6px);opacity:.72;transition:opacity .15s,transform .15s;
  }
  .result{
    position:absolute;bottom:8%;left:50%;transform:translateX(-50%) translateY(8px);
    font-size:28px;font-weight:850;letter-spacing:.6px;opacity:0;transition:opacity .22s,transform .22s;text-align:center;
  }
  .result.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .result small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:5px;letter-spacing:.4px}
  .controls{display:flex;justify-content:center;align-items:center;gap:10px}
  .pill{
    min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;
    padding:13px 16px;font-weight:800;font-size:14px;
  }
  .pill:active{transform:scale(.98)}
  .pill.secondary{color:var(--muted)}
  .status{font-size:12px;color:var(--muted);text-align:center;margin-top:5px;min-height:16px}
  @media (max-height:650px){
    .coin-wrap{width:165px;height:165px}
    .head-silhouette{transform:scale(.78) rotate(-7deg);transform-origin:top left}
    .eagle{transform:translate(-50%,-50%) scale(.78)}
    .shadow{top:calc(50% + 105px)}
    .result{bottom:3%}
    .hint{top:2%}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">Coin Flip</div>
    <div class="mode" aria-label="Flip mode">
      <button id="singleBtn" class="active">Single</button>
      <button id="bo3Btn">Best of 3</button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="hint" id="hint">Flick the coin upward or shake your phone</div>
    <div class="score" id="score">Heads 0 · Tails 0</div>

    <div class="shadow" id="shadow"></div>

    <div class="coin-wrap" id="coinWrap">
      <div class="coin" id="coin">
        <div class="face heads real-quarter">
          <img class="quarter-photo" src="https://upload.wikimedia.org/wikipedia/commons/7/70/2021-P_US_Quarter_Obverse.jpg" alt="Heads — 2021 U.S. quarter obverse" draggable="false">
        </div>
        <div class="face tails real-quarter">
          <img class="quarter-photo" src="https://upload.wikimedia.org/wikipedia/commons/e/eb/United_States_Quarter_Reverse_2021.jpg" alt="Tails — 2021 U.S. quarter reverse" draggable="false">
        </div>
        <div class="edge"></div>
      </div>
    </div>

    <div class="result" id="result"></div>
  </main>

  <div>
    <div class="controls">
      <button class="pill secondary" id="motionBtn">Enable Shake</button>
      <button class="pill" id="flipBtn">Flip</button>
      <button class="pill secondary" id="soundBtn">Sound On</button>
    </div>
    <div class="status" id="status">Secure 50/50 randomness · tap Enable Shake to test your sensor</div>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const coinWrap = document.getElementById('coinWrap');
  const coin = document.getElementById('coin');
  const shadow = document.getElementById('shadow');
  const resultEl = document.getElementById('result');
  const scoreEl = document.getElementById('score');
  const hint = document.getElementById('hint');
  const singleBtn = document.getElementById('singleBtn');
  const bo3Btn = document.getElementById('bo3Btn');
  const motionBtn = document.getElementById('motionBtn');
  const flipBtn = document.getElementById('flipBtn');
  const soundBtn = document.getElementById('soundBtn');
  const statusEl = document.getElementById('status');

  let mode = 'single';
  let flipping = false;
  let soundOn = true;
  let motionEnabled = false;
  let lastShake = 0;
  let lastAccel = {x:0,y:0,z:0};
  let audioCtx = null;
  let touchStart = null;
  let didSwipe = false;
  let series = {heads:0, tails:0};

  function secureBit(){
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return (a[0] & 1) === 0 ? 'heads' : 'tails';
  }

  function secureFloat(min,max){
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return min + (a[0] / 4294967295) * (max-min);
  }

  function vibrate(pattern){
    if(navigator.vibrate) navigator.vibrate(pattern);
  }

  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, duration, gain=.05, delay=0, type='sine'){
    if(!soundOn) return;
    ensureAudio();
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.78), t0+duration);
    o.type = type;
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = 4.5;
    g.gain.setValueAtTime(Math.max(.0001,gain), t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + duration);
    o.connect(f).connect(g).connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + duration + .02);
  }

  function noiseTick(duration=.035, gain=.035, delay=0){
    if(!soundOn) return;
    ensureAudio();
    const sr = audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, Math.max(1,Math.floor(sr*duration)), sr);
    const data = buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2.4);
    }
    const src = audioCtx.createBufferSource();
    const hp = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    hp.type='highpass';
    hp.frequency.value=1700;
    g.gain.value=gain;
    src.buffer=buffer;
    src.connect(hp).connect(g).connect(audioCtx.destination);
    src.start(audioCtx.currentTime+delay);
  }

  function clink(intensity=1){
    const r = 0.92 + secureFloat(0,.16);
    noiseTick(.028,.028*intensity,0);
    tone(510*r,.10,.040*intensity,0,'sine');
    tone(940*r,.075,.026*intensity,.006,'sine');
    tone(1460*r,.055,.017*intensity,.012,'sine');
    tone(265*r,.13,.016*intensity,.018,'triangle');
  }

  function launchSound(){
    noiseTick(.018,.012,0);
    tone(180,.07,.012,0,'triangle');
  }

  function setMode(next){
    if(flipping) return;
    mode = next;
    singleBtn.classList.toggle('active', mode==='single');
    bo3Btn.classList.toggle('active', mode==='bo3');
    scoreEl.classList.toggle('show', mode==='bo3');
    series = {heads:0,tails:0};
    updateScore();
    clearResult();
  }

  function updateScore(){
    scoreEl.textContent = `Heads ${series.heads} · Tails ${series.tails}`;
  }

  function clearResult(){
    resultEl.classList.remove('show');
    setTimeout(()=>{ resultEl.innerHTML=''; },220);
  }

  function showResult(text, sub=''){
    resultEl.innerHTML = `${text.toUpperCase()}${sub ? `<small>${sub}</small>` : ''}`;
    resultEl.classList.add('show');
  }

  function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

  async function doFlip(gesture={vx:0, vy:-1.4, strength:1}){
    if(flipping) return;
    flipping = true;
    clearResult();
    hint.style.opacity = .15;

    const outcome = secureBit();

    // Gesture changes only visuals. Outcome remains secure 50/50.
    const dir = Math.max(-1,Math.min(1,gesture.vx || secureFloat(-.35,.35)));
    const strength = Math.max(.65,Math.min(2.2,gesture.strength || 1));
    const rise = secureFloat(180,300) * Math.min(1.45,strength);
    const drift = dir * secureFloat(35,95);
    const tiltX = secureFloat(-20,20);
    const tiltZ = secureFloat(-20,20);
    const duration = secureFloat(1050,1650);
    const turns = Math.round(secureFloat(5,9) + strength*1.1);

    // Heads is 0 mod 360 on Y; tails is 180 mod 360.
    const endY = turns*360 + (outcome === 'tails' ? 180 : 0);
    const startX = secureFloat(-6,6);
    const startZ = secureFloat(-6,6);

    coinWrap.animate([
      {transform:`translate3d(0,0,0) rotateX(${startX}deg) rotateZ(${startZ}deg)`, offset:0},
      {transform:`translate3d(${drift*.45}px,${-rise}px,0) rotateX(${tiltX+18}deg) rotateZ(${tiltZ}deg)`, offset:.47},
      {transform:`translate3d(${drift}px,-12px,0) rotateX(${tiltX}deg) rotateZ(${tiltZ*.5}deg)`, offset:.86},
      {transform:`translate3d(${drift*.96}px,0,0) rotateX(0deg) rotateZ(0deg)`, offset:1}
    ],{
      duration,
      easing:'cubic-bezier(.18,.72,.22,1)',
      fill:'forwards'
    });

    coin.animate([
      {transform:'rotateY(0deg) rotateX(0deg)', offset:0},
      {transform:`rotateY(${endY*.48}deg) rotateX(${secureFloat(-55,55)}deg)`, offset:.48},
      {transform:`rotateY(${endY*.91}deg) rotateX(${secureFloat(-12,12)}deg)`, offset:.88},
      {transform:`rotateY(${endY}deg) rotateX(0deg)`, offset:1}
    ],{
      duration,
      easing:'cubic-bezier(.14,.55,.22,1)',
      fill:'forwards'
    });

    shadow.animate([
      {transform:'translateX(-50%) scale(1)',opacity:.72},
      {transform:`translateX(calc(-50% + ${drift*.35}px)) scale(.55)`,opacity:.22,offset:.48},
      {transform:`translateX(calc(-50% + ${drift}px)) scale(.94)`,opacity:.66,offset:.88},
      {transform:`translateX(calc(-50% + ${drift*.96}px)) scale(1)`,opacity:.72}
    ],{duration,easing:'ease-in-out',fill:'forwards'});

    launchSound();
    await wait(duration*0.86);
    clink(Math.min(1.35,.85 + strength*.18));
    vibrate([22,35,12]);
    await wait(duration*0.14);

    // Small landing bounce.
    coinWrap.animate([
      {transform:`translate3d(${drift*.96}px,0,0) scale(1)`},
      {transform:`translate3d(${drift*.96}px,-12px,0) scale(.995)`,offset:.35},
      {transform:`translate3d(${drift*.96}px,0,0) scale(1)`}
    ],{duration:260,easing:'ease-out',fill:'forwards'});
    await wait(260);

    if(mode === 'single'){
      showResult(outcome);
      flipping = false;
      hint.style.opacity = 1;
      return;
    }

    series[outcome]++;
    updateScore();

    if(series[outcome] >= 2){
      showResult(`${outcome} wins`,'Best of 3');
      series = {heads:0,tails:0};
      await wait(1000);
      updateScore();
      flipping = false;
      hint.style.opacity = 1;
      return;
    }

    showResult(outcome, `${series.heads}–${series.tails}`);
    await wait(650);
    clearResult();
    flipping = false;
    await wait(180);
    return doFlip({
      vx: secureFloat(-.55,.55),
      vy: -secureFloat(1,1.7),
      strength: secureFloat(.85,1.3)
    });
  }

  stage.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'mouse') return;
    didSwipe = false;
    touchStart = {x:e.clientX,y:e.clientY,t:performance.now()};
  });

  stage.addEventListener('pointerup', e=>{
    if(!touchStart || flipping) return;
    const dt = Math.max(80, performance.now()-touchStart.t);
    const dx = e.clientX-touchStart.x;
    const dy = e.clientY-touchStart.y;
    const dist = Math.hypot(dx,dy);
    const vy = dy/dt;
    const vx = dx/dt;

    // Require an upward-ish flick/swipe.
    if(dist > 34 && dy < -18){
      didSwipe = true;
      const strength = Math.min(2.2, Math.max(.7, (-vy*2.2)+(dist/260)));
      doFlip({vx:Math.max(-1,Math.min(1,vx*2.3)),vy,strength});
    }
    touchStart = null;
  });

  stage.addEventListener('pointercancel',()=>touchStart=null);

  // Desktop/tap fallback without interfering with swipe.
  flipBtn.addEventListener('click',()=>doFlip({
    vx:secureFloat(-.35,.35),
    vy:-secureFloat(1,1.6),
    strength:secureFloat(.85,1.25)
  }));


  coinWrap.addEventListener('click', ()=>{
    if(flipping || didSwipe) return;
    doFlip({
      vx:secureFloat(-.25,.25),
      vy:-secureFloat(1,1.45),
      strength:secureFloat(.85,1.15)
    });
  });

  singleBtn.addEventListener('click',()=>setMode('single'));
  bo3Btn.addEventListener('click',()=>setMode('bo3'));

  soundBtn.addEventListener('click',()=>{
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'Sound On' : 'Sound Off';
    if(soundOn){ ensureAudio(); tone(520,.06,.035); }
  });

  let motionSamples = 0;
  let lastMagnitude = 9.81;
  let sensorCheckTimer = null;

  function triggerShake(strength=1){
    if(flipping) return;
    const now = performance.now();
    if(now-lastShake < 850) return;
    lastShake = now;
    doFlip({
      vx:secureFloat(-.55,.55),
      vy:-1.3,
      strength:Math.min(1.9,Math.max(.9,strength))
    });
  }

  function evaluateAcceleration(x,y,z){
    const mag = Math.sqrt(x*x+y*y+z*z);
    const jerk = Math.abs(mag-lastMagnitude);
    const gravityDelta = Math.abs(mag-9.81);
    lastMagnitude = mag;
    motionSamples++;

    if(motionSamples === 1){
      motionEnabled = true;
      motionBtn.textContent = 'Shake On';
      statusEl.textContent = 'Shake ready · sensor data received';
      if(sensorCheckTimer) clearTimeout(sensorCheckTimer);
    }

    // Deliberate shake: either a sharp change between samples or strong movement away from 1g.
    if(jerk > 5.8 || gravityDelta > 7.2){
      triggerShake(Math.max(.9, Math.min(1.9, (Math.max(jerk,gravityDelta)/7))));
    }
  }

  function handleMotion(e){
    const a = e.accelerationIncludingGravity || e.acceleration;
    if(!a || a.x == null || a.y == null || a.z == null) return;
    evaluateAcceleration(Number(a.x),Number(a.y),Number(a.z));
  }

  async function tryGenericAccelerometer(){
    if(!('Accelerometer' in window)) return false;
    try{
      if(navigator.permissions && navigator.permissions.query){
        try{
          const p = await navigator.permissions.query({name:'accelerometer'});
          if(p.state === 'denied') return false;
        }catch(_){}
      }
      const sensor = new Accelerometer({frequency:40});
      sensor.addEventListener('reading',()=>{
        evaluateAcceleration(Number(sensor.x||0),Number(sensor.y||0),Number(sensor.z||0));
      });
      sensor.addEventListener('error',()=>{});
      sensor.start();
      window.__coinAccelerometer = sensor;
      return true;
    }catch(_){
      return false;
    }
  }

  function motionPolicyAllows(){
    try{
      const policy = document.permissionsPolicy || document.featurePolicy;
      if(policy && typeof policy.allowsFeature === 'function'){
        return policy.allowsFeature('accelerometer');
      }
    }catch(_){}
    return true;
  }

  async function enableMotion(){
    motionSamples = 0;
    motionEnabled = false;
    motionBtn.textContent = 'Testing…';

    if(!window.isSecureContext){
      motionBtn.textContent = 'Shake Needs HTTPS';
      statusEl.textContent = 'Android Chrome will not expose motion sensors here. Open the app from an HTTPS website.';
      return;
    }

    if(window.top !== window.self && !motionPolicyAllows()){
      motionBtn.textContent = 'Shake Blocked';
      statusEl.textContent = 'This preview blocks the accelerometer. Open the page directly in Chrome.';
      return;
    }

    statusEl.textContent = 'Waiting for Android motion data… move the phone now.';

    let listenerAttached = false;
    try{
      if('DeviceMotionEvent' in window){
        if(typeof DeviceMotionEvent.requestPermission === 'function'){
          const p = await DeviceMotionEvent.requestPermission();
          if(p === 'granted'){
            window.addEventListener('devicemotion',handleMotion,{passive:true});
            listenerAttached = true;
          }
        }else{
          window.addEventListener('devicemotion',handleMotion,{passive:true});
          listenerAttached = true;
        }
      }
    }catch(_){}

    // Chromium fallback. Safe to try even when DeviceMotion is present but silent.
    const genericStarted = await tryGenericAccelerometer();

    sensorCheckTimer = setTimeout(()=>{
      if(motionSamples === 0){
        motionEnabled = false;
        motionBtn.textContent = 'Shake Blocked';
        if(window.top !== window.self){
          statusEl.textContent = 'No sensor data reached this embedded preview. Open it directly in Chrome.';
        }else if(!motionPolicyAllows()){
          statusEl.textContent = 'The page policy blocks accelerometer access.';
        }else{
          statusEl.textContent = 'No motion data. In Chrome: Site settings → Motion sensors → Allow, then reload.';
        }
      }
    },2200);

    if(!listenerAttached && !genericStarted){
      // Timer still gives one consistent error path.
    }
  }

  motionBtn.addEventListener('click',()=>{
    if(!motionEnabled) enableMotion();
  });


  document.querySelectorAll('.quarter-photo').forEach(img=>{
    img.addEventListener('error',()=>{
      statusEl.textContent = 'Quarter photo could not load. This version needs internet once for the real coin images.';
    });
  });

  // Prevent accidental page scrolling while flicking.
  stage.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();
</script>
</body>
</html>
